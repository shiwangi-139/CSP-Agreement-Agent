    async review() {
      const d = await api("/api/hub/review");
      const kind = (reason) => /^Spot check/.test(reason) ? ["APPROVAL", "spot check"] : /^DC upload/.test(reason) ? ["APPROVAL", "DC upload"] : /^Reference check/.test(reason) ? ["APPROVAL", "reference check"] : ["REVIEW", "needs a decision"];
      return `<p class="small muted">Conflicts the agent can't decide (a different CSP's name on the document, a typed date that differs from the one read…), plus <b>spot checks</b> (5% of documents the agent accepted on its own) and <b>reference checks</b>. Open the document, then <b>Accept</b> if the type, the CSP and the issue date are right, correct the date if it's wrong, or <b>Reject</b> if it's the wrong document or CSP. Your answers measure the agent's accuracy (see Accuracy).</p>
      <div class="toolbar"><span class="count-chip">${d.rows.length} waiting</span>${d.rows.length ? `<span class="small muted">oldest waits ${ago(d.rows[0].created_at)}</span>` : ""}</div>
      ${d.rows.map((r) => `<div class="card rv">
        <a class="rv-file" href="#" data-file="${r.document.id}" title="View the document"><svg><use href="#i-file"/></svg><span>View</span></a>
        <div class="rv-main">
        <div class="meta">${badge(kind(r.reason)[0], kind(r.reason)[1])} <a href="#" data-csp="${r.csp.id}"><b class="mono">${esc(r.csp.code)}</b> ${esc(r.csp.name)}</a> · <b>${esc(DOC[r.document.type] || r.document.type)}</b>
          <span class="small muted" style="margin-left:auto">waiting ${ago(r.created_at)}</span></div>
        <div class="rv-dates">issued <span class="mono">${fmt(r.document.issue_date)}</span>${r.document.expiry_date ? ` · expires <span class="mono">${fmt(r.document.expiry_date)}</span>` : r.document.validity_rule === "PVR_PCC_LIFETIME" ? ` · <b>no expiry</b> (Police Clearance Certificate)` : ""}</div>
        <p class="rv-reason">${esc(r.reason)}</p>
        ${whyBox(r.document, true)}
        ${aiHint(r.document.model_suggestion)}
        <div class="toolbar rv-fields"><a href="#" data-file="${r.document.id}">View document</a> · <a href="#" data-fileorig="${r.document.id}" class="small">download original</a>
          <label>Correct issue date <input type="date" id="rv${r.id}" value="${esc(r.document.issue_date || "")}"></label>
          <label>Expiry date <input type="date" id="re${r.id}" value="${esc(r.document.expiry_date || "")}" title="The last day written on the document (overrides 'Validity stated')"></label>
          <label>Type <select id="rt${r.id}">${["AGREEMENT", "POLICE_VERIFICATION", "IIBF_CERTIFICATE"].map((t) =>
            `<option value="${t}" ${t === r.document.type ? "selected" : ""}>${esc(DOC[t] || t)}</option>`).join("")}</select></label>
          <label>Validity stated <select id="rm${r.id}"><option value="">as read</option>
            <optgroup label="Agreement"><option value="12">1 year</option><option value="24">2 years</option><option value="36">3 years</option><option value="60">5 years</option></optgroup>
            <optgroup label="Police certificate"><option value="6">6 months</option><option value="12">1 year</option><option value="-1">No expiry (Police Clearance Certificate)</option></optgroup></select></label>
          <button class="btn" data-reread="${r.id}" title="Read the document again with the agent's latest rules (doesn't accept it)">Re-read with current rules</button>
          <button class="btn primary" data-resolve="${r.id}" data-accept="1">Accept</button>
          <button class="btn danger" data-resolve="${r.id}" data-accept="0">Reject document</button></div></div></div>`).join("") || `<div class="card empty">Nothing to review. ✓</div>`}`;
    },
  };

  // How the agent read a document (app/why.py): the dates, where each came
  // from, the exact text, and what it ignored. Open in the Review queue.
  function whyBox(d, open) {
    const w = d && d.why;
    if (!w) return "";
    return `<details class="why" ${open ? "open" : ""}><summary>How the agent read it${d.decided_by_person ? " · dates now set by a person" : ""}</summary>
      <div class="why-sum">${esc(w.summary)}</div>
      ${(w.lines || []).map((l) => `<div class="why-line"><b>${esc(l.what)}: ${esc(l.value)}</b> <span class="muted">from ${esc(l.how)}</span>
        ${l.text ? `<div class="why-text">“${esc(l.text)}”</div>` : ""}</div>`).join("")}
      ${(w.ignored || []).length ? `<div class="why-ign">${w.ignored.map((i) => `<div>↷ ${esc(i)}</div>`).join("")}</div>` : ""}</details>`;
  }

  // What the local AI model read (a suggestion only; the reviewer decides).
  function aiHint(s) {
    if (!s) return "";
    if (!s.provider || s.legible === false) return `<p class="small muted">AI helper could not read this document either.</p>`;
    const v = s.validity_months ? (s.validity_months % 12 ? `${s.validity_months} months` : `${s.validity_months / 12} year(s)`) : "not stated";
    return `<p class="small" style="background:var(--saffron-soft,#fdf3d7);padding:6px 10px;border-radius:8px">🤖 <b>AI helper read</b> (check it on the document):
      type ${esc(DOC[s.document_type] || s.document_type || "-")} · issued <span class="mono">${esc(s.issue_date || "not read")}</span> · validity ${esc(v)}
      ${s.evidence ? `<br><span class="muted">“${esc(s.evidence)}”</span>` : ""}</p>`;
  }

  function pager(pages) {
    if (pages <= 1) return "";
    return `<div class="toolbar" style="margin-top:10px"><button class="btn" data-page="${state.page - 1}" ${state.page <= 1 ? "disabled" : ""}>‹ Prev</button>
      <span class="small muted">Page ${state.page} of ${pages}</span><button class="btn" data-page="${state.page + 1}" ${state.page >= pages ? "disabled" : ""}>Next ›</button></div>`;
  }

  function msgCard(m) {
    const draft = m.status === "QUEUED_FOR_REVIEW";
    return `<div class="msg" data-msg="${m.id}">
      <div class="meta">${badge(m.status)} <b class="mono">${esc(m.csp_code || "")}</b> ${esc(m.csp_name || "")}
        <span class="small muted">→ ${esc(m.role)} · ${esc(m.to)} · ${esc(m.template)} · ${esc(m.stage || "")}${m.edited ? " · edited" : ""}</span>
        <span class="small muted" style="margin-left:auto">${when(m.created_at)}</span></div>
      ${m.channel === "EMAIL" ? `<div style="margin-top:6px"><b>${esc(m.subject)}</b></div>` : ""}
      <pre>${esc(m.body)}</pre>
      ${m.error ? `<div class="small" style="color:var(--danger-ink);margin-top:6px">${esc(m.error)}</div>` : ""}
      ${m.sent_at ? `<div class="small muted">Sent ${when(m.sent_at)}${m.delivery_status ? " · " + esc(m.delivery_status) : ""}</div>` : ""}
      ${m.reviewed_by ? `<div class="small muted">Reviewed by ${esc(m.reviewed_by)} · ${when(m.reviewed_at)}</div>` : ""}
      ${draft ? `<div class="actions"><button class="btn primary" data-approve="${m.id}">Approve${m.channel === "WHATSAPP" && !["wabs", "push"].includes(window.WA_MODE) ? "" : " & send"}</button>
        <button class="btn" data-edit="${m.id}">Edit text</button><button class="btn danger" data-reject="${m.id}">Reject</button></div>` : ""}
      ${m.status === "READY_NOT_SENT" && m.channel === "WHATSAPP" && ["wabs", "push"].includes(window.WA_MODE)
        ? `<div class="actions"><button class="btn primary" data-sendnow="${m.id}">Send now</button>
           <button class="btn danger" data-reject="${m.id}">Reject</button></div>` : ""}
    </div>`;
  }

  // ------------------------------------------------------------ drawer
  async function openCsp(id) {
    const d = await api(`/api/hub/csp/${id}`);
    const c = d.csp;
    const person = (p, label) => p ? `${esc(p.name)} · ${esc(p.phone || "no phone")} · ${esc(p.email || "no email")}` : `<span class="muted">no ${label} assigned</span>`;
    const isAdmin = state.summary.me.role === "ADMIN";
    // Newest first: files received and messages, the 8 latest.
    const recent = [...d.documents.map((x) => ({at: x.uploaded_at || x.source_date, text: `${DOC[x.type] || x.type} received`,
                       sub: `${x.channel === "CSP_UPLOAD_PORTAL" ? "upload page" : "Gmail"} · ${(x.status || "").replaceAll("_", " ").toLowerCase()}`})),
                    ...d.messages.map((m) => ({at: m.sent_at || m.created_at, text: `${m.channel === "EMAIL" ? "Email" : "WhatsApp"} to ${m.role}: ${m.template}`,
                       sub: (m.status || "").replaceAll("_", " ").toLowerCase() + (m.error ? " · " + m.error : "")}))]

  function openFile(id, download) { return openPath(`api/hub/documents/${id}/file${download ? "?download=1" : ""}`); }
  async function openPath(path) {
    // Documents open straight in the browser's own viewer (the login cookie
    // goes with it), which shows the first page while the rest still loads.
    if (path.startsWith("api/hub/documents/")) {
      if (path.includes("download=1")) {                 // the original file, saved as is
        const a = document.createElement("a"); a.href = path; a.download = ""; document.body.appendChild(a); a.click(); a.remove();
      } else if (!window.open(path, "_blank")) toast("Allow pop-ups for this site to view documents.");
      return;
    }
    // Open the tab now, while the click still counts: a tab opened after the
    // download finishes is blocked as a pop-up.
    const tab = window.open("", "_blank");
    if (tab) tab.document.write("<p style='font-family:sans-serif'>Loading document…</p>");
    const r = await fetch(path, {credentials: "same-origin", headers: H});
    if (!r.ok) { if (tab) tab.close(); return toast(r.status === 401 ? "Wrong API key." : "File not found."); }
    const url = URL.createObjectURL(await r.blob());
    if (tab) tab.location.href = url;
    else toast("Allow pop-ups for this site to view documents.");
    setTimeout(() => URL.revokeObjectURL(url), 60000);
  }

        toast("Saved."); return render();
      }
      if (ds.cc) { await post(`/api/hub/contact-changes/${ds.cc}`); return render(); }
      if (ds.resolve) {
        if (ds.accept !== "1" && !confirm("Reject this document? It will no longer count for this CSP.")) return;
        await post(`/api/hub/review/${ds.resolve}/resolve`, {accept: ds.accept === "1", issue_date: $(`#rv${ds.resolve}`)?.value || null,
          document_type: $(`#rt${ds.resolve}`)?.value || null, validity_months: Number($(`#rm${ds.resolve}`)?.value) || null,
          expiry_date: $(`#re${ds.resolve}`)?.value || null});
        toast("Resolved."); return render();
      }
    } catch (err) { toast(err.message); }
  });
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") { closeDrawer(); closeCoach(); closeNav(); $("#gresults").classList.remove("open"); }
    if (e.key === "/" && !/input|textarea|select/i.test(document.activeElement.tagName)) { e.preventDefault(); $("#gsearch").focus(); }
    if (e.key === "Enter" && e.target.matches(".kpi[data-go]")) e.target.click();
    if (e.key === "Enter" && e.target.id === "q") { state.q = e.target.value; state.page = 1; render(); }
  });
  document.addEventListener("change", (e) => {
    if (e.target.id === "dcprogday" && $("#dcprog").style.display === "block") document.querySelector("[data-dcprogress]").click();
    if (e.target.id === "expiredonly") { state.expiredOnly = e.target.checked; state.page = 1; render(); }
    if (e.target.dataset.fkey) {
      const f = {...state.find, [e.target.dataset.fkey]: e.target.value};
      if (!e.target.value) delete f[e.target.dataset.fkey];
      state.find = f; state.page = 1; render();
    }
  });
  async function refreshAfterAction() { if ($("#drawer").classList.contains("open")) closeDrawer(); render(); }

  // ------------------------------------------------- search on every page
  let searchTimer = null;
  $("#gsearch").addEventListener("input", (e) => {
    clearTimeout(searchTimer);
    const q = e.target.value.trim();
    if (q.length < 2) { $("#gresults").classList.remove("open"); return; }
    searchTimer = setTimeout(async () => {
      const d = await api(`/api/hub/search?q=${encodeURIComponent(q)}`);
      $("#gresults").innerHTML = d.rows.length ? d.rows.map((r) => `<button data-csp="${r.id}" role="option">
          <span>${esc(r.name)}</span><small class="mono">${esc(r.code)}${r.category ? " · Label " + esc(r.sub_slab || r.category) : ""}</small></button>`).join("")
        : `<div class="small muted" style="padding:8px 10px">No CSP matches “${esc(q)}”.</div>`;
      $("#gresults").classList.add("open");
    }, 250);
  });
  $("#gsearch").addEventListener("keydown", (e) => { if (e.key === "Enter") { const b = $("#gresults [data-csp]"); if (b) b.click(); } });
  document.addEventListener("click", (e) => { if (!e.target.closest(".gsearch")) $("#gresults").classList.remove("open"); else if (e.target.closest("[data-csp]")) $("#gresults").classList.remove("open"); });

  // ------------------------------------------------------- Agent Coach
  const LEVEL = {critical: ["bad", "Fix now"], warn: ["warn", "Should fix"], info: ["", "Good to know"], good: ["ok", "Going well"]};
  const coachAct = (a) => !a ? "" : a.do === "run" ? `<button class="btn primary" data-run="${esc(a.arg)}">${esc(a.label)}</button>`
    : `<button class="btn" data-go="${esc(a.arg)}">${esc(a.label)}</button>`;
  async function openCoach() {
    const c = $("#coach");
    closeDrawer(); closeNav();
    c.classList.add("open"); $("#backdrop").classList.add("open"); $("#coachbtn").setAttribute("aria-expanded", "true");
    c.innerHTML = `<div class="drawerhead"><div><div class="eyebrow">What the agent should improve</div><h2 class="dname">Agent Coach</h2>
      <div class="sub">Worked out from the agent's own records, nothing guessed.</div></div><button class="iconbtn" id="coachclose" aria-label="Close"><svg><use href="#i-close"/></svg></button></div>
      <div class="drawerbody coach-body"><div class="small muted">Reading the agent's numbers…</div></div>`;
    $("#coachclose").onclick = closeCoach;
    try {
      const d = await api("/api/hub/coach");
      $("#n-coach").textContent = d.findings.filter((f) => f.level === "critical" || f.level === "warn").length || "";
      $(".coach-body", c).innerHTML = `<div class="overline">Findings, most urgent first</div>
        ${d.findings.map((f) => `<div class="finding ${esc(f.level)}"><div class="kind">${chip(LEVEL[f.level][0], LEVEL[f.level][1])}</div>
          <h3>${esc(f.title)}</h3><p>${esc(f.detail)}</p>${f.action ? coachAct(f.action) : ""}</div>`).join("") || `<div class="finding good"><h3>Nothing to improve right now. ✓</h3></div>`}
        <div class="overline" style="margin-top:18px">Ask the Coach</div>
        <div class="quick">${d.questions.map((q) => `<button class="btn" data-ask="${esc(q)}">${esc(q)}</button>`).join("")}</div>
        <div id="coachchat"></div>
        <form id="coachform" class="coach-ask"><input type="text" id="coachq" placeholder="Ask about the agent…" autocomplete="off"><button class="btn primary">Ask</button></form>`;
      $("#coachform").onsubmit = (e) => { e.preventDefault(); const q = $("#coachq").value.trim(); if (q) coachAsk(q); $("#coachq").value = ""; };
    } catch (err) { $(".coach-body", c).innerHTML = `<div class="empty">Couldn't load: ${esc(err.message)}</div>`; }
  }
  function closeCoach() {
    $("#coach").classList.remove("open"); $("#coachbtn").setAttribute("aria-expanded", "false");
    if (!$("#drawer").classList.contains("open") && !side.classList.contains("open")) $("#backdrop").classList.remove("open");
  }
  async function coachAsk(q) {
    const chat = $("#coachchat"); if (!chat) return;
    chat.insertAdjacentHTML("beforeend", `<div class="bubble me">${esc(q)}</div>`);
    try {
      const r = await post("/api/hub/coach/ask", {question: q});
      chat.insertAdjacentHTML("beforeend", `<div class="bubble bot"><b>${esc(r.answer)}</b>${(r.lines || []).length ? `<ul>${r.lines.map((l) => `<li>${esc(l)}</li>`).join("")}</ul>` : ""}${r.action ? coachAct(r.action) : ""}</div>`);
    } catch (err) { chat.insertAdjacentHTML("beforeend", `<div class="bubble bot">${esc(err.message)}</div>`); }
    chat.lastElementChild.scrollIntoView({block: "nearest"});
  }
  $("#coachbtn").onclick = () => $("#coach").classList.contains("open") ? closeCoach() : openCoach();

  // ------------------------------------------------------------ render
  async function render() {
    try {
      state.summary = await api("/api/hub/summary");
      const s = state.summary;
      const me = s.me || {}, isAdmin = me.role === "ADMIN";
      if (!views[state.view] || (!isAdmin && ["activity", "monitoring", "accuracy", "contacts", "ingestion"].includes(state.view))) state.view = "today";
      const drafts = s.drafts_pending.EMAIL + s.drafts_pending.WHATSAPP;
      $("#n-drafts").textContent = drafts || ""; $("#n-review").textContent = s.review_pending || "";
      $("#m-review").textContent = s.review_pending || "";
      $("#n-questions").textContent = s.questions_open || "";
      $("#nav-analytics").style.display = s.features?.analytics ? "" : "none";     // parked feature
      $("#n-form").textContent = s.form_uploads?.rejected || "";
      $("#n-cat").textContent = (s.categories[2] + s.categories[3] + s.categories[4]) || "";
      const auto = s.modes.outbound !== "review";
      $("#modepill").innerHTML = `<span class="dot"></span>${auto ? "Auto mode · approved messages" : "Review mode · nothing sent without approval"}`;
      $("#modepill").className = `mode ${auto ? "ok" : "warn"}`;
      $("#whoami").innerHTML = `<b>${esc(me.name || "")}</b><br>${esc(me.role || "")} · <a href="#" id="logout">Sign out</a>`;
      $("#avatar").textContent = (me.name || "?").split(/[ @.]/).filter(Boolean).slice(0, 2).map((w) => w[0].toUpperCase()).join("");
      $("#logout").onclick = (e) => { e.preventDefault(); logout(); };
      document.querySelectorAll(".admin-only").forEach((el) => el.style.display = isAdmin ? "" : "none");
      window.WA_MODE = s.modes.whatsapp;
      $("#modes").innerHTML = `Outbound: <b>${esc(s.modes.outbound)}</b> · WhatsApp: <b>${esc(s.modes.whatsapp)}</b><br>Sheet: ${esc(s.modes.calling_sheet)}`;
      document.querySelectorAll("[data-view]").forEach((b) => { if (b.closest("#nav, #mobilebar")) b.classList.toggle("active", b.dataset.view === state.view); });
      const [group, title, sub] = PAGES[state.view];
      $("#crumb").textContent = group; $("#title").textContent = title;
      document.title = `${title} · Eko CSP Renewals`;
      const head = state.view === "today" ? "" : `<div class="greeting"><div><div class="eyebrow">${esc(group)}</div><h1>${esc(title)}</h1><div class="sub">${esc(sub)}</div></div></div>`;
      const body = await views[state.view]();
      $("#view").innerHTML = head + body;
    } catch (err) { if (err.message !== "Unauthorised") $("#view").innerHTML = `<div class="card empty">Couldn't load: ${esc(err.message)}</div>`; }
  }
  // The Coach's number on its button (admins), once per sign-in.
  async function coachCount() {
    try { const d = await api("/api/hub/coach"); $("#n-coach").textContent = d.findings.filter((f) => f.level === "critical" || f.level === "warn").length || ""; } catch (e) {}
  }
  async function boot() {
    $("#login").style.display = "none"; $("#app").style.display = "block"; $("#mobilebar").style.display = "";
    await render();
    if (state.summary?.me?.role === "ADMIN") coachCount();
  }
  boot();
})();
</script>
</body>
</html>
