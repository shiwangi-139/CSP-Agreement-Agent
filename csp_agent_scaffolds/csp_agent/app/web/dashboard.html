<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Eko CSP Renewals</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&family=JetBrains+Mono:wght@500;600&family=Noto+Sans+Devanagari:wght@400;600&display=swap">
<link rel="stylesheet" href="static/eko.css?v=8">
</head>
<body>
<!-- Icons (line style, drawn in the text colour). -->
<svg class="sprite" aria-hidden="true">
  <symbol id="i-today" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4.5 4.5"/></symbol>
  <symbol id="i-tag" viewBox="0 0 24 24"><path d="M20.6 13.4 13.4 20.6a2 2 0 0 1-2.8 0L3 13V3h10l7.6 7.6a2 2 0 0 1 0 2.8z"/><circle cx="7.5" cy="7.5" r="1.5"/></symbol>
  <symbol id="i-chart" viewBox="0 0 24 24"><path d="M3 3v18h18"/><path d="M7 15v2M11 11v6M15 7v10M19 12v5"/></symbol>
  <symbol id="i-inbox" viewBox="0 0 24 24"><path d="M4 4h16l2 11v5H2v-5z"/><path d="M2 15h6l2 3h4l2-3h6"/></symbol>
  <symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 15V3M7 8l5-5 5 5"/><path d="M4 15v4a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-4"/></symbol>
  <symbol id="i-file" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M8 13h8M8 17h6"/></symbol>
  <symbol id="i-message" viewBox="0 0 24 24"><path d="M21 11.5a8.5 8.5 0 0 1-12.3 7.6L3 21l1.9-5.7A8.5 8.5 0 1 1 21 11.5z"/></symbol>
  <symbol id="i-help" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6V14M12 17.5h.01"/></symbol>
  <symbol id="i-trend" viewBox="0 0 24 24"><path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/></symbol>
  <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
  <symbol id="i-pulse" viewBox="0 0 24 24"><path d="M3 12h4l3-8 4 16 3-8h4"/></symbol>
  <symbol id="i-target" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/></symbol>
  <symbol id="i-users" viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H7a4 4 0 0 0-4 4v2"/><circle cx="9.5" cy="7" r="4"/><path d="M21 21v-2a4 4 0 0 0-3-3.8M16 3.2a4 4 0 0 1 0 7.6"/></symbol>
  <symbol id="i-mail" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></symbol>
  <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20.9 13A9 9 0 0 1 11 3.1 9 9 0 1 0 20.9 13z"/></symbol>
  <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></symbol>
  <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 4v6h-6"/><path d="M4 20v-6h6"/><path d="M5.6 9A7 7 0 0 1 19 10M18.4 15A7 7 0 0 1 5 14"/></symbol>
  <symbol id="i-bot" viewBox="0 0 24 24"><rect x="4" y="7" width="16" height="13" rx="3"/><path d="M12 3v4M9 13h.01M15 13h.01M9 17h6"/></symbol>
  <symbol id="i-close" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></symbol>
  <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></symbol>

  <symbol id="i-more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol>
  <symbol id="i-alert" viewBox="0 0 24 24"><path d="M10.3 3.9 2.6 17.2A2 2 0 0 0 4.3 20h15.4a2 2 0 0 0 1.7-2.8L13.7 3.9a2 2 0 0 0-3.4 0zM12 9v4m0 3h.01"/></symbol>
  <symbol id="i-send" viewBox="0 0 24 24"><path d="M22 2 11 13M22 2l-7 20-4-9-9-4z"/></symbol>
</svg>

<div id="login" class="login card" style="display:none">
  <img src="static/logo.png?v=2" alt="Eko" class="logo-img" style="height:28px;width:auto;max-width:110px;margin-bottom:8px" onerror="this.remove()">
  <h2>Eko CSP Renewals</h2>
  <p class="muted">Sign in with your Eko email and password.</p>
  <form id="loginf">
    <label>Email <input type="email" id="lemail" autocomplete="username" required style="width:100%"></label>
    <label>Password <input type="password" id="lpass" autocomplete="current-password" required style="width:100%"></label>
    <p class="small" id="lerr" style="color:var(--danger-ink)"></p>
    <p><button class="btn primary" style="width:100%">Sign in</button></p></form>
</div>

<div class="shell" id="app" style="display:none">
  <!-- Menu: icons only; it opens over the page on hover (or with the keyboard), and stays open when pinned. -->
  <aside class="side" id="nav" aria-label="Main menu">
    <div class="brand">
      <span class="brandmark"><img src="static/logo.png?v=2" alt="Eko" onerror="this.replaceWith(Object.assign(document.createElement('b'), {textContent: 'eko'}))"></span>
      <span class="navtext brandtext"><strong>CSP Renewals</strong><small>SBI Kiosk Banking · compliance</small></span>
      <button class="pin navtext" id="pin" title="Keep the menu open" aria-pressed="false"><svg><use href="#i-pin"/></svg></button>
    </div>
    <div class="navgroup"><div class="navlabel">Work</div>
      <button class="nav" data-view="today" title="Today"><svg><use href="#i-today"/></svg><span class="navtext">Today</span><span class="count" id="n-today"></span></button>
      <button class="nav" data-view="find" title="Find CSPs"><svg><use href="#i-search"/></svg><span class="navtext">Find CSPs</span></button>
      <button class="nav" data-view="categories" title="Labels"><svg><use href="#i-tag"/></svg><span class="navtext">Labels</span><span class="count" id="n-cat"></span></button>
      <button class="nav" data-view="overview" title="Overview"><svg><use href="#i-chart"/></svg><span class="navtext">Overview</span></button>
    </div>
    <div class="navgroup"><div class="navlabel">Documents</div>
      <button class="nav" data-view="review" title="Review queue"><svg><use href="#i-inbox"/></svg><span class="navtext">Review queue</span><span class="count" id="n-review"></span></button>
      <button class="nav" data-view="formuploads" title="Form uploads & DC link"><svg><use href="#i-upload"/></svg><span class="navtext">Form uploads &amp; DC link</span><span class="count" id="n-form"></span></button>
      <button class="nav" data-view="documents" title="Latest documents"><svg><use href="#i-file"/></svg><span class="navtext">Latest documents</span></button>
    </div>
    <div class="navgroup"><div class="navlabel">Messages</div>
      <button class="nav" data-view="comms" title="Communication Hub"><svg><use href="#i-message"/></svg><span class="navtext">Communication Hub</span><span class="count" id="n-drafts"></span></button>
      <button class="nav" data-view="questions" title="CSP questions"><svg><use href="#i-help"/></svg><span class="navtext">CSP questions</span><span class="count" id="n-questions"></span></button>
      <button class="nav" data-view="analytics" id="nav-analytics" title="Messaging analytics" style="display:none"><svg><use href="#i-trend"/></svg><span class="navtext">Messaging analytics</span></button>
    </div>
    <div class="navgroup admin-only"><div class="navlabel">Admin</div>
      <button class="nav" data-view="activity" title="Activity"><svg><use href="#i-clock"/></svg><span class="navtext">Activity</span></button>
      <button class="nav" data-view="monitoring" title="Monitoring"><svg><use href="#i-pulse"/></svg><span class="navtext">Monitoring</span></button>
      <button class="nav" data-view="accuracy" title="Accuracy & reading check"><svg><use href="#i-target"/></svg><span class="navtext">Accuracy</span></button>
      <button class="nav" data-view="contacts" title="Contacts & gaps"><svg><use href="#i-users"/></svg><span class="navtext">Contacts &amp; gaps</span></button>
      <button class="nav" data-view="ingestion" title="Gmail ingestion"><svg><use href="#i-mail"/></svg><span class="navtext">Gmail ingestion</span></button>
    </div>
    <div class="sidefoot">
      <div class="navtext small" id="modes"></div>
      <div class="user"><span class="avatar" id="avatar"></span><span class="navtext" id="whoami"></span></div>
    </div>
  </aside>
  <main>
    <header class="topbar">
      <button class="iconbtn menu" id="menu" aria-label="Open the menu"><svg><use href="#i-menu"/></svg></button>
      <div class="ttl"><div class="crumb" id="crumb"></div><div class="title" id="title">Today</div></div>
      <div class="gsearch" role="search">
        <svg><use href="#i-search"/></svg>
        <input type="search" id="gsearch" placeholder="Search a CSP: KO code, name or phone…" autocomplete="off" aria-label="Search a CSP">
        <kbd class="kbd">/</kbd>
        <div id="gresults" class="gresults" role="listbox"></div>
      </div>
      <div class="topactions">
        <span class="mode" id="modepill"></span>
        <button class="iconbtn" id="theme" title="Light / dark" aria-label="Switch light or dark"><svg><use href="#i-moon"/></svg></button>
        <button class="btn refresh" id="refresh"><svg><use href="#i-refresh"/></svg><span>Refresh</span></button>
      </div>
    </header>
    <div class="content"><section id="view"></section></div>
  </main>
</div>

<nav class="mobilebar" id="mobilebar" aria-label="Menu">
  <button data-view="today"><svg><use href="#i-today"/></svg>Today</button>
  <button data-view="find"><svg><use href="#i-search"/></svg>Find</button>
  <button data-view="review"><svg><use href="#i-inbox"/></svg>Review<span class="count" id="m-review"></span></button>
  <button data-view="comms"><svg><use href="#i-message"/></svg>Messages</button>
  <button id="more"><svg><use href="#i-more"/></svg>More</button>
</nav>

<button class="coachbtn admin-only" id="coachbtn" aria-controls="coach" aria-expanded="false" style="display:none"><svg><use href="#i-bot"/></svg>Agent Coach <span class="count" id="n-coach"></span></button>
<aside class="drawer coach" id="coach" aria-label="Agent Coach"></aside>
<div class="backdrop" id="backdrop"></div>
<aside class="drawer" id="drawer" aria-label="CSP"></aside>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(() => {
  "use strict";
  const $ = (s, el = document) => el.querySelector(s);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const fmt = (iso) => iso ? iso.slice(0, 10).split("-").reverse().join("-") : "—";
  const when = (iso) => iso ? new Date(iso).toLocaleString("en-IN", {dateStyle: "medium", timeStyle: "short"}) : "—";
  const DOC = {AGREEMENT: "Agreement", POLICE_VERIFICATION: "PVR / Character", IIBF_CERTIFICATE: "IIBF"};
  const CAT = {1: ["All documents on file", "Agreement, PVR and IIBF all received"],
               2: ["1 document missing", "Two received, one missing or unreadable"],
               3: ["2 documents missing", "One received, two missing or unreadable"],
               4: ["No documents", "Nothing readable on file in 2 years"],
               5: ["Inactive", "Terminal Inactive on the calling sheet: no messages are sent"]};
  const slab = (k) => k === 5 ? "Inactive" : `Label ${k} · ${CAT[k][0]}`;          // "slab" is used elsewhere at Eko: users see "Label"
  // Find CSPs: one state per document; "" = any.
  const FSTATES = [["", "any"], ["VALID", "valid"], ["EXPIRING", "expiring ≤60d"], ["EXPIRED", "expired"], ["MISSING", "missing"], ["UNREADABLE", "unreadable"]];
  const FPRESETS = [
    ["Only agreement expired", {agr: "EXPIRED", pvr: "VALID", iibf: "VALID"}],
    ["Only PVR expired", {agr: "VALID", pvr: "EXPIRED", iibf: "VALID"}],
    ["Agreement expired (any other)", {agr: "EXPIRED"}],
    ["PVR expired (any other)", {pvr: "EXPIRED"}],
    ["Agreement expiring ≤60d", {agr: "EXPIRING"}],
    ["PVR expiring ≤60d", {pvr: "EXPIRING"}],
    ["Only IIBF missing", {agr: "VALID", pvr: "VALID", iibf: "MISSING"}],
    ["Everything valid", {agr: "VALID", pvr: "VALID", iibf: "VALID"}],
  ];
  const findQuery = (f) => ["agr", "pvr", "iibf", "slab", "rm", "form"].filter((k) => f[k]).map((k) => `${k}=${encodeURIComponent(f[k])}`).join("&");
  const state = {view: "today", find: {}, cat: 1, q: "", expiredOnly: false, page: 1, channel: "WHATSAPP", msgStatus: "QUEUED_FOR_REVIEW", docType: "", summary: null};

  // ---------------------------------------------------------------- api
  // Paths are relative (no leading "/"): the page is served at "/" on the
  // server and at /csp-agreement-agent/admin/ through Nginx. The session is a
  // cookie; X-Requested-With proves the request comes from this page.
  const H = {"X-Requested-With": "csp-dashboard"};
  const rel = (path) => path.replace(/^\//, "");
  async function api(path, opts = {}) {
    const r = await fetch(rel(path), {...opts, credentials: "same-origin", headers: {"Content-Type": "application/json", ...H, ...(opts.headers || {})}});
    if (r.status === 401) { showLogin(); throw new Error("Unauthorised"); }
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.detail?.en || j.detail || r.statusText);
    return j;
  }
  const post = (path, body) => api(path, {method: "POST", body: JSON.stringify(body || {})});
  function toast(t) { const el = $("#toast"); el.textContent = t; el.style.display = "block"; clearTimeout(toast.t); toast.t = setTimeout(() => el.style.display = "none", 3200); }
  function showLogin() { $("#app").style.display = "none"; $("#mobilebar").style.display = "none"; $("#coachbtn").style.display = "none"; $("#login").style.display = "block"; }
  $("#loginf").onsubmit = async (e) => {
    e.preventDefault(); $("#lerr").textContent = "";
    const r = await fetch("auth/login", {method: "POST", credentials: "same-origin", headers: {"Content-Type": "application/json", ...H},
      body: JSON.stringify({email: $("#lemail").value.trim(), password: $("#lpass").value})});
    $("#lpass").value = "";
    if (!r.ok) { const j = await r.json().catch(() => ({})); $("#lerr").textContent = j.detail || "Sign-in failed."; return; }
    boot();
  };
  async function logout() { await fetch("auth/logout", {method: "POST", credentials: "same-origin", headers: H}); location.reload(); }

  // --------------------------------------------------------------- theme
  const isDark = () => (document.documentElement.dataset.theme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light")) === "dark";
  const themeIcon = () => { $("#theme use").setAttribute("href", isDark() ? "#i-sun" : "#i-moon"); };
  $("#theme").onclick = () => {
    document.documentElement.dataset.theme = isDark() ? "light" : "dark";
    try { localStorage.setItem("eko_theme", document.documentElement.dataset.theme); } catch (e) {}
    themeIcon();
  };
  try { const t = localStorage.getItem("eko_theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  themeIcon();

  // ---------------------------------------------------------------- menu
  // Icons only; it opens over the page on hover or with the keyboard, and
  // stays open (taking its own space) when pinned. On a phone it is hidden
  // and opens from "More" in the bottom bar.
  const side = $("#nav");
  function setPin(on) {
    side.classList.toggle("pinned", on); document.body.classList.toggle("pinned", on);
    $("#pin").setAttribute("aria-pressed", on); $("#pin").title = on ? "Let the menu fold away" : "Keep the menu open";
    try { localStorage.setItem("eko_side", on ? "pinned" : ""); } catch (e) {}
  }
  try { setPin(localStorage.getItem("eko_side") === "pinned"); } catch (e) { setPin(false); }
  $("#pin").onclick = (e) => { e.stopPropagation(); setPin(!side.classList.contains("pinned")); };
  const phone = () => matchMedia("(max-width: 640px)").matches;
  function openNav() { side.classList.add("open"); $("#backdrop").classList.add("open"); }
  function closeNav() { side.classList.remove("open"); if (!$("#drawer").classList.contains("open") && !$("#coach").classList.contains("open")) $("#backdrop").classList.remove("open"); }
  $("#menu").onclick = () => phone() ? openNav() : setPin(!side.classList.contains("pinned"));
  $("#more").onclick = openNav;

  // ------------------------------------------------------------- Today
  const pctOf = (n, d) => d ? Math.round(100 * n / d) : 0;
  const ACT = (a, it) => {
    const cls = `btn${a.primary ? " primary" : ""}`;
    const id = it.csp ? it.csp.id : "";
    if (a.do === "csp") return `<button class="${cls}" data-csp="${id}">${esc(a.label)}</button>`;
    if (a.do === "view") return `<button class="${cls}" data-go="${esc(a.arg)}">${esc(a.label)}</button>`;
    if (a.do === "take") return `<button class="${cls}" data-takefile="${esc(a.arg)}">${esc(a.label)}</button>`;
    if (a.do === "kept") return `<button class="${cls}" data-keptfile="${esc(a.arg)}">${esc(a.label)}</button>`;
    if (a.do === "remind") return `<button class="${cls}" data-remind="${id}">${esc(a.label)}</button>`;
    if (a.do === "run") return `<button class="${cls}" data-run="${esc(a.arg)}">${esc(a.label)}</button>`;
    return "";
  };
  const KIND = {refused: "Refused upload", stuck: "Keeps trying", question: "Question", expiring: "Ends soon",
                opened_no_upload: "Opened, no upload", failed: "WhatsApp failed", review: "Review queue"};
  // The goal's daily % (fully compliant), drawn to scale with an area under it.
  function goalSpark(trend) {
    if (trend.length < 2) return `<div class="small muted">The daily trend appears after two days of snapshots.</div>`;
    const W = 160, H = 48, xs = (i) => 3 + i * (W - 6) / (trend.length - 1);
    const lo = Math.min(...trend.map((t) => t.pct)), hi = Math.max(...trend.map((t) => t.pct), lo + 1);
    const ys = (v) => H - 5 - (v - lo) * (H - 12) / (hi - lo);
    const pts = trend.map((t, i) => `${xs(i).toFixed(1)},${ys(t.pct).toFixed(1)}`).join(" ");
    return `<svg class="gspark" viewBox="0 0 ${W} ${H}" role="img" aria-label="Fully compliant per day: ${trend.map((t) => t.pct + "%").join(", ")}">
      <polygon points="${xs(0).toFixed(1)},${H} ${pts} ${xs(trend.length - 1).toFixed(1)},${H}" class="area"/>
      <polyline points="${pts}" class="line"/>
      ${trend.map((t, i) => `<circle cx="${xs(i).toFixed(1)}" cy="${ys(t.pct).toFixed(1)}" r="${i === trend.length - 1 ? 3.5 : 2}"><title>${fmt(t.day)}: ${t.pct}% (${t.done} of ${t.total})</title></circle>`).join("")}</svg>`;
  }
  // Page heading: [menu group, title, one line on what the page is for].
  const PAGES = {
    today: ["Work", "Today", "Your daily compliance worklist"],
    find: ["Work", "Find CSPs", "Pick a state for each document and see exactly those CSPs"],
    categories: ["Work", "Labels", "CSPs by how many of their 3 documents are on file"],
    overview: ["Work", "Overview", "Document health across the whole network, and the jobs you can run by hand"],
    review: ["Documents", "Review queue", "Documents waiting for a person's decision before the CSP's status changes"],
    formuploads: ["Documents", "Form uploads & DC link", "What CSPs and DCs sent through the upload page, the DC master link and DC reports"],
    documents: ["Documents", "Latest documents", "Current documents per CSP, and every file uploaded through the links"],
    comms: ["Messages", "Communication Hub", "Drafts, sent and failed messages to CSPs, RMs and DCs"],
    questions: ["Messages", "CSP questions", "Questions CSPs asked on their upload page"],
    analytics: ["Messages", "Messaging analytics", "From message to documents"],
    activity: ["Admin", "Activity", "What people did on the dashboard, and what CSPs and DCs did on their links"],
    monitoring: ["Admin", "Monitoring", "Is the agent running, reading, sending and keeping records right"],
    accuracy: ["Admin", "Accuracy", "How well the agent reads documents: the nightly reading check and people's checks"],
    contacts: ["Admin", "Contacts & gaps", "RM and DC numbers, missing contacts, and contact changes CSPs typed"],
    ingestion: ["Admin", "Gmail ingestion", "Emails read for CSP documents"],
  };

  // ------------------------------------------------------- reading check
  // Last night's re-reading of documents a person already decided
  // (scripts/eval_reading.py, 02:30): the score, what got fixed or broke,
  // the hold-out set (never used to write rules), the "why" records, and
  // the validity rules in use. GET /api/hub/reading-check (admins).
  const T3S = {AGREEMENT: "Agreement", POLICE_VERIFICATION: "Police certificate", IIBF_CERTIFICATE: "IIBF"};
  const scoreTrend = (now, before) => before == null || now == null ? `<span class="small muted">first run</span>`
    : now < before ? chip("ok", `better: ${before} → ${now}`) : now > before ? chip("bad", `worse: ${before} → ${now}`) : chip("", "same as the run before");
  function rcList(rows, kind) {
    if (!rows.length) return `<p class="small muted">${kind === "fixed" ? "Nothing newly fixed." : "Nothing broke. ✓"}</p>`;
    return `<ul class="rc-list">${rows.map((r) => `<li><a href="#" data-csp="${r.csp_id}"><b class="mono">${esc(r.csp_code)}</b> ${esc(r.csp_name)}</a>
      · ${esc(T3S[r.type] || r.type)} · <a href="#" data-file="${r.doc_id}">view</a>
      <div class="small muted">${kind === "fixed" ? `was: ${r.verdict === "WRONG ACCEPT" ? "would be accepted wrongly" : "refused wrongly"} → now read right`
        : r.verdict === "WRONG ACCEPT" ? "now: would be ACCEPTED wrongly" : "now: would be refused wrongly"}</div></li>`).join("")}</ul>`;
  }
  function readingCheckCard(rc) {
    if (!rc) return "";
    const t = rc.sets.tuning, h = rc.sets.holdout, cov = rc.why_coverage;
    const covBar = `<div class="rc-why"><b>"How the agent read it" records</b>: ${cov.with_why} of ${cov.current} current documents
      <div class="meter"><span style="width:${pctOf(cov.with_why, cov.current)}%"></span></div>
      <span class="small muted">Saved for every document read from now on; older ones get one with "Re-read with current rules" in the Review queue.</span></div>`;
    const rules = rc.rules.length ? `<details class="why"><summary>Validity rules in use (${rc.rules.length})</summary><table class="rc-rules"><tbody>
      ${rc.rules.map((r) => `<tr><td>${esc(r.words)}${r.default ? ` ${chip("warn", "default")}` : ""}</td><td class="mono small muted">${esc(r.code)}</td><td class="num">${r.documents}</td></tr>`).join("")}</tbody></table></details>` : "";
    if (!t) return `<div class="card rc"><div class="rc-head"><div><div class="overline">Context &amp; harness</div><h2>Reading check</h2>
      <div class="small muted">Every night at 02:30 the agent re-reads the documents a person already decided and scores itself. The first check hasn't run yet.</div></div></div>${covBar}${rules}</div>`;
    const ty = Object.entries(t.by_type).filter(([k]) => k !== "ALL");
    const all = t.by_type.ALL || {};
    const level = all.wrong_accept ? "bad" : all.wrong_reject ? "warn" : "ok";
    return `<div class="card rc rc-${level}">
      <div class="rc-head">
        <div><div class="overline">Context &amp; harness</div><h2>Reading check</h2>
          <div class="small muted">Last run ${ago(t.at)} · ${all.documents || 0} documents a person decided, re-read with today's rules</div></div>
        <div class="rc-score"><div class="n">${t.score ?? "—"}</div><div class="small muted">score · lower is better</div>${scoreTrend(t.score, t.previous_score)}</div>
        <div class="rc-trend">${spark(t.history.map((x) => x.score), level === "ok" ? "ok" : "")}<div class="small muted">last ${t.history.length} runs</div></div>
      </div>
      <p class="small muted" style="margin:0 0 12px">Score = 10 × documents it would accept wrongly + documents it would refuse wrongly. A wrong accept counts 10 times: an invalid document would get through.</p>
      <div class="rc-types">${ty.map(([k, v]) => `<div class="rc-type">
          <div class="label">${esc(T3S[k] || k)}</div>
          <div class="rc-row"><span>Accepted wrongly</span><b class="${v.wrong_accept ? "rc-tbad" : ""}">${v.wrong_accept}</b></div>
          <div class="rc-row"><span>Refused wrongly</span><b class="${v.wrong_reject ? "rc-twarn" : ""}">${v.wrong_reject}</b></div>
          <div class="rc-row muted"><span>Re-read</span><span>${v.documents}</span></div></div>`).join("")}</div>
      <div class="rc-changes">
        <div><h3>Fixed since the run before (${t.fixed.length})</h3>${rcList(t.fixed, "fixed")}</div>
        <div><h3>Broke since the run before (${t.broken.length})</h3>${rcList(t.broken, "broken")}</div>
      </div>
      <div class="rc-foot">
        <div><b>Hold-out check</b> <span class="small muted">(documents never used to write rules)</span><br>
          ${h ? `score <b>${h.score ?? "—"}</b> on ${h.by_type.ALL?.documents || 0} documents ${scoreTrend(h.score, h.previous_score)}` : `<span class="small muted">not run yet</span>`}</div>
        ${covBar}
      </div>
      ${rules}
    </div>`;
  }

  // ----------------------------------------------------------- badges
  const badge = (s, label) => `<span class="b ${esc(s)}">${esc(label || String(s).replaceAll("_", " ").toLowerCase())}</span>`;
  function docCell(d) {
    if (!d) return "—";
    if (d.status === "VALID") {
      const soon = d.days_left != null && d.days_left <= 60;
      return `<span class="b ${soon ? "soon" : "VALID"}">${d.expiry_date ? (soon ? d.days_left + "d left" : "valid") : "valid · lifetime"}</span><div class="small muted mono">${d.expiry_date ? "exp " + fmt(d.expiry_date) : "iss " + fmt(d.issue_date)}</div>`;
    }
    if (d.status === "EXPIRED") return `${badge("EXPIRED", "expired")}<div class="small muted mono">exp ${fmt(d.expiry_date)}</div>`;
    return badge(d.status, d.status === "UNREADABLE" ? "unreadable" : "missing");
  }

  // ------------------------------------------------------- monitoring page
  // Shared look for Monitoring and Messaging analytics: one status band in
  // words, a strip of numbers that carry their own small chart, then panels.
  // Every status has an icon and words; colour only adds to them.
  const ICON = {ok: "✓", warn: "⚠", bad: "⛔"};
  const chip = (level, text) => `<span class="mx-chip ${esc(level)}">${ICON[level] || ""} ${esc(text)}</span>`;
  const mon = (s) => s ? chip(s.level, s.text) : "";
  // "6 min ago", "3 h ago", "2 days ago"; the full time on hover (title).
  function ago(iso) {
    if (!iso) return "never";
    const m = Math.max(0, (Date.now() - new Date(iso).getTime()) / 60000);
    const t = m < 1 ? "just now" : m < 60 ? `${Math.round(m)} min ago` : m < 2880 ? `${Math.round(m / 60)} h ago` : `${Math.round(m / 1440)} days ago`;
    return `<span title="${esc(when(iso))}">${t}</span>`;
  }
  function band(level, title, sub, chips = []) {
    return `<div class="mx-band ${esc(level)}"><div class="mx-dot" aria-hidden="true">${ICON[level] || "•"}</div>
      <div><b>${esc(title)}</b>${sub ? `<div class="mx-sub">${esc(sub)}</div>` : ""}</div>
      <div class="mx-chips">${chips.join("")}</div></div>`;
  }
  // One number in the strip: label, value (+ small unit), a mini chart, a note; level marks it with a top edge.
  const metric = (k, v, unit, note, viz = "", level = "") => `<div class="mx-metric ${esc(level)}"><span class="mx-k">${esc(k)}</span>
    <span class="mx-v">${v ?? "—"}${unit ? `<small> ${esc(unit)}</small>` : ""}</span>${viz}<span class="mx-note">${note || ""}</span></div>`;
  const strip = (...m) => `<div class="mx-strip">${m.join("")}</div>`;
  const panel = (title, hint, body, extra = "") => `<div class="mx-panel ${extra}"><h2>${esc(title)}</h2>${hint ? `<p class="mx-hint">${hint}</p>` : ""}${body}</div>`;
  // Mini charts (inline SVG, drawn to scale, colours from the theme).
  function fill(used, total, level = "") {
    const w = total ? Math.min(120, 120 * used / total) : 0;
    return `<svg class="mx-viz thin" viewBox="0 0 120 8" preserveAspectRatio="none" aria-hidden="true"><rect width="120" height="8" rx="4" class="mx-track"></rect>
      <rect width="${w}" height="8" rx="4" class="mx-fill ${esc(level)}"></rect></svg>`;
  }
  function spark(values, level = "") {
    const v = (values || []).filter((x) => x != null);
    if (v.length < 2) return `<svg class="mx-viz" viewBox="0 0 120 24" aria-hidden="true"></svg>`;
    const max = Math.max(...v), min = Math.min(...v), span = max - min || 1;
    const pts = v.map((x, i) => [i * 120 / (v.length - 1), 21 - 18 * (x - min) / span]);
    const line = pts.map((p) => p.map((n) => n.toFixed(1)).join(",")).join(" ");
    const [ex, ey] = pts[pts.length - 1];
    return `<svg class="mx-viz" viewBox="0 0 120 24" aria-hidden="true"><polygon points="0,24 ${line} 120,24" class="mx-area ${esc(level)}"></polygon>
      <polyline points="${line}" class="mx-line ${esc(level)}"></polyline><circle cx="${ex.toFixed(1)}" cy="${ey.toFixed(1)}" r="2.6" class="mx-end ${esc(level)}"></circle></svg>`;
  }
  function blocks(levels) {
    const n = levels.length || 1, w = 120 / n;
    return `<svg class="mx-viz thin" viewBox="0 0 120 8" preserveAspectRatio="none" aria-hidden="true">${levels.map((l, i) =>
      `<rect x="${(i * w + 1).toFixed(1)}" width="${(w - 2).toFixed(1)}" height="8" rx="2" class="mx-fill ${esc(l)}"></rect>`).join("")}</svg>`;
  }
  // Horizontal bars: [[label, value, level?], ...], value written at the end of each bar.
  function bars(rows, empty = "Nothing yet.") {
    if (!rows || !rows.length) return `<p class="mx-hint">${empty}</p>`;
    const max = Math.max(...rows.map((r) => r[1]), 1);
    return `<div class="mx-bars">${rows.map(([l, v, lev]) => `<div class="mx-bar"><span class="mx-bl">${esc(l)}</span>
      <span class="mx-bt"><span class="mx-fillbar ${esc(lev || "")}" style="width:${v ? Math.max(2, 100 * v / max) : 0}%"></span></span><span class="mx-bv">${v}</span></div>`).join("")}</div>`;
  }
  // Columns per day, stacked: series [{day, key: n}], keys [[key, label, cssVar]].
  function columns(series, keys) {
    if (!series || !series.length) return `<p class="mx-hint">No history yet: it builds up day by day.</p>`;
    const tot = series.map((r) => keys.reduce((a, [k]) => a + (r[k] || 0), 0)), max = Math.max(...tot, 1);
    const W = 300, H = 110, gap = 2, w = Math.max(3, (W - 30) / series.length - gap);
    const x = (i) => 28 + i * (w + gap);
    const grid = [0.5, 1].map((f) => `<line x1="28" x2="${W}" y1="${H - H * f + 4}" y2="${H - H * f + 4}" class="mx-grid"></line>
      <text x="24" y="${H - H * f + 8}" text-anchor="end">${Math.round(max * f)}</text>`).join("");
    const cols = series.map((r, i) => { let y = H + 4; return keys.map(([k, , col]) => { const h = H * (r[k] || 0) / max; y -= h;
      return h ? `<rect x="${x(i).toFixed(1)}" y="${y.toFixed(1)}" width="${w.toFixed(1)}" height="${h.toFixed(1)}" rx="1.5" style="fill:var(${col})"><title>${esc(r.day)} · ${esc(k)}: ${r[k]}</title></rect>` : ""; }).join(""); }).join("");
    return `<svg class="mx-chart" viewBox="0 0 ${W} ${H + 22}" role="img" aria-label="per day">${grid}${cols}
      <text x="28" y="${H + 18}">${esc(fmt(series[0].day))}</text><text x="${W}" y="${H + 18}" text-anchor="end">${esc(fmt(series[series.length - 1].day))}</text></svg>
      <div class="mx-legend">${keys.map(([, l, col]) => `<span><i style="background:var(${col})"></i>${esc(l)}</span>`).join("")}</div>`;
  }
  // Timeline of a job's runs in the last 24 h (left = 24 h ago, right = now).
  function ribbon(runs) {
    return `<svg class="mx-ribbon" viewBox="0 0 120 12" preserveAspectRatio="none" aria-label="${runs.length} runs in 24 h" role="img">
      <rect width="120" height="12" rx="3" class="mx-track"></rect>${runs.map((r) =>
      `<rect x="${(118 - 118 * Math.min(r.hours_ago, 24) / 24).toFixed(1)}" y="1" width="2" height="10" class="mx-fill ${r.status === "FAILED" ? "bad" : r.status === "SKIPPED" ? "" : "ok"}"></rect>`).join("")}</svg>`;
  }
  const kv = (rows, empty = "Nothing yet.") => rows && rows.length
    ? `<dl class="mx-kv">${rows.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join("")}</dl>` : `<p class="mx-hint">${empty}</p>`;
  const code = (c) => `<span class="mx-code">${esc(c)}</span>`;
  const T3 = {AGREEMENT: "Agreement", POLICE_VERIFICATION: "Police certificate", IIBF_CERTIFICATE: "IIBF"};
  const hrs = (h) => h == null ? "—" : h >= 48 ? `${Math.round(h / 24)} days` : `${Math.round(h)} h`;

  const MON = {
    status(d) {
      const late = d.jobs.filter((j) => j.status.level !== "ok");
      const chips = [...late.map((j) => chip(j.status.level, `${j.label}: ${j.status.text}`)),
                     ...(d.whatsapp.status.level !== "ok" ? [mon(d.whatsapp.status)] : [])];
      const title = d.overall.level === "ok" ? "Everything ran on time" : d.overall.text;
      const wa = d.whatsapp, rh = d.review_helper, okJobs = d.jobs.length - late.length;
      return band(d.overall.level, title, late.length ? "Jobs below are late or failed; the rest ran normally." : "All jobs ran when they should.", chips)
      + strip(
        metric("WhatsApp today", wa.today, `/ ${wa.limit}`, `${esc(wa.mode)} mode · ${wa.send_window_open ? "sending now" : "outside"} ${esc(wa.send_hours)}`,
               fill(wa.today, wa.limit, wa.status.level), wa.status.level === "ok" ? "" : wa.status.level),
        metric("Last Gmail scan", d.gmail.last_scan ? ago(d.gmail.last_scan.at) : "never", "", d.gmail.backfill_done ? "2-year backfill done" : "backfill still running"),
        metric("Review helper", rh.read_today, `/ ${rh.limit}`, rh.on ? "local AI · 8 pm to 8 am" : "switched off", fill(rh.read_today, rh.limit)),
        metric("Jobs on time", okJobs, `/ ${d.jobs.length}`, late.length ? `${late.length} need a look` : "none late or failed",
               blocks(d.jobs.map((j) => j.status.level)), late.some((j) => j.status.level === "bad") ? "bad" : late.length ? "warn" : ""))
      + `<div class="mx-cols">` + panel("Jobs", "Each job's runs over the last 24 hours (right edge = now). Late = no run for longer than it should be.",
        `<div class="tablewrap"><table class="mx-table"><thead><tr><th>Job</th><th>Status</th><th>Last 24 h</th><th>Last run</th><th class="r">Took</th></tr></thead><tbody>
        ${d.jobs.map((j) => `<tr><td><b>${esc(j.label)}</b>${j.last_error ? `<div class="mx-err">${esc(j.last_error)}</div>` : ""}</td><td>${mon(j.status)}</td>
          <td>${ribbon(j.runs_24h || [])}</td><td class="mx-when">${j.last ? ago(j.last.at) : "—"}</td>
          <td class="r mx-when">${j.last?.minutes == null ? "—" : j.last.minutes < 1 ? "under 1 min" : j.last.minutes + " min"}</td></tr>`).join("")}</tbody></table></div>`)
      + panel("Gmail messages", "By what happened to them", bars(Object.entries(d.gmail.messages_by_status || {}).map(([k, v]) => [k.replaceAll("_", " ").toLowerCase(), v, k.includes("ERROR") || k.includes("FAIL") ? "bad" : ""])))
      + `</div>`;
    },
    documents(d) {
      const up = d.upload_page, o = d.outcome;
      const days = d.per_day.map((r) => (r.gmail || 0) + (r["upload page"] || 0));
      return band(up.csps_tried_twice_nothing_accepted ? "warn" : "ok",
        up.csps_tried_twice_nothing_accepted ? `${up.csps_tried_twice_nothing_accepted} CSP(s) tried twice and nothing was accepted` : "No CSP is stuck on the upload page",
        up.csps_tried_twice_nothing_accepted ? "Call them first: see Form uploads → Tried, nothing accepted." : `${d.total} documents came in over ${d.days} days.`)
      + strip(
        metric(`Documents · ${d.days} days`, d.total, "", "Gmail and the upload page", spark(days)),
        metric("Accepted", o.accepted || 0, "", `in review ${o["in review"] || 0} · unreadable ${o.unreadable || 0}`, fill(o.accepted || 0, d.total, "ok")),
        metric("Upload page files", up.files || 0, "", `${up.submissions || 0} submissions`),
        metric("Turned away", (up.turned_away_reasons || []).reduce((a, r) => a + r[1], 0), "", "reasons below", "", (up.turned_away_reasons || []).length ? "warn" : ""))
      + `<div class="mx-cols">` + panel("Per day", "", columns(d.per_day, [["gmail", "Gmail", "--primary"], ["upload page", "Upload page", "--forest-light"]]))
      + `<div class="mx-stack">` + panel("By document", "", bars(Object.entries(d.by_type).map(([k, v]) => [T3[k] || k, v])))
      + panel("Why files were turned away", "Upload page", bars(up.turned_away_reasons, "None."))
      + `</div></div>`;
    },
    accuracy(d) {
      const sc = d.spot_checks || {}, wr = d.wrong_rejections, ev = d.evaluations[0], ck = d.document_checks[0];
      const all = ev?.summary?.by_type?.ALL;
      const hist = d.evaluations.slice().reverse().map((r) => r.summary?.by_type?.ALL?.correct_or_safe_percent);
      const bad = wr.count + d.wrong_acceptances + (all ? all["WRONG ACCEPT"] || 0 : 0);
      const head = !ev ? band("warn", "No reading evaluation yet", "Run it on the server: python -m scripts.eval_reading")
        : band((all?.["WRONG ACCEPT"] || 0) ? "bad" : (all?.["wrong reject"] || 0) ? "warn" : "ok",
          (all?.["WRONG ACCEPT"] || 0) ? `${all["WRONG ACCEPT"]} document(s) accepted with a wrong date` : "No wrong acceptances in the latest evaluation",
          `${all?.documents ?? 0} documents a person decided, read again ${ago(ev.at)} with code ${ev.summary.commit || "?"}.`,
          [chip((all?.["WRONG ACCEPT"] || 0) ? "bad" : "ok", `${all?.["WRONG ACCEPT"] || 0} wrong accepts`),
           chip((all?.["wrong reject"] || 0) ? "warn" : "ok", `${all?.["wrong reject"] || 0} wrong rejects`)]);
      const evRows = ev ? Object.entries(ev.summary.by_type || {}).filter(([t]) => t !== "ALL").map(([t, s]) => `<tr><td><b>${esc(T3[t] || t)}</b></td>
        <td class="r">${s.documents}</td><td class="r">${s.correct || 0}</td><td class="r">${s["safe review"] || 0}</td>
        <td class="r">${(s["WRONG ACCEPT"] || 0) ? chip("bad", s["WRONG ACCEPT"]) : chip("ok", "0")}</td>
        <td class="r">${(s["wrong reject"] || 0) ? chip("warn", s["wrong reject"]) : "0"}</td></tr>`).join("") : "";
      return head + strip(
        metric("Correct or safely reviewed", all?.correct_or_safe_percent ?? "—", all ? "%" : "", "latest evaluation", spark(hist, "")),
        metric("Spot-check accuracy", sc.accuracy ?? "—", sc.accuracy != null ? "%" : "", `${sc.checked || 0} checked by a person`),
        metric("CSPs told wrongly", wr.count, "", `of ${wr.of_turned_away} turned-away uploads`, "", wr.count ? "bad" : ""),
        metric("Validity only a default", d.default_validity.count, "", "current documents, no stated validity", "", d.default_validity.count ? "warn" : ""))
      + `<div class="mx-cols">` + panel("Latest evaluation by document", ev ? `${esc(ev.summary.set)} set · documents a person decided are the correct answers` : "",
        ev ? `<div class="tablewrap"><table class="mx-table"><thead><tr><th>Document</th><th class="r">Checked</th><th class="r">Correct</th><th class="r">Safe review</th><th class="r">Wrong accept</th><th class="r">Wrong reject</th></tr></thead><tbody>${evRows}</tbody></table></div>`
           : `<p class="mx-hint">Not run yet.</p>`)
      + `<div class="mx-stack">` + panel("Latest full document check", ck ? ago(ck.at) : "", ck ? bars([["same", ck.summary.same || 0, "ok"], ["different", ck.summary.DIFFERENT || 0, "warn"], ["review", ck.summary.review || 0], ["reads as another", ck.summary["reads as another"] || 0, "warn"], ["not readable", ck.summary["not readable"] || 0, "bad"], ["timeout", ck.summary.timeout || 0, "bad"]].filter((r) => r[1])) : `<p class="mx-hint">Not run yet.</p>`)
      + panel("CSPs told wrongly (latest)", "Turned away, later accepted", kv(wr.examples.map((x) => [code(x.csp), `${esc(x.section)} · ${esc(x.reason)}`]), "None."))
      + `</div></div>` + panel("Where validity came from", "Current accepted documents", bars(d.rules_used.map((r) => [`${T3[r.type] || r.type} · ${r.rule.replaceAll("_", " ").toLowerCase()}`, r.documents, r.rule.includes("DEFAULT") ? "warn" : ""])), "mx-wide");
    },
    review(d) {
      const total = Object.values(d.decided_30d).reduce((a, b) => a + b, 0);
      return band(d.status.level, d.waiting ? `${d.waiting} document(s) waiting for a person` : "Nothing waiting", d.status.text,
        [`<a class="mx-link" href="#" data-go="review">Open the Review queue →</a>`])
      + strip(
        metric("Waiting", d.waiting, "", "documents and checks"),
        metric("Oldest waits", hrs(d.oldest_hours), "", "⚠ after 1 day · ⛔ after 2", "", d.status.level === "ok" ? "" : d.status.level),
        metric("Median time to decide", d.median_hours_to_decision ?? "—", d.median_hours_to_decision != null ? "h" : "", "last 30 days"),
        metric("Decided · 30 days", total, "", Object.entries(d.decided_30d).map(([k, v]) => `${k.toLowerCase()} ${v}`).join(" · ")))
      + `<div class="mx-cols3">` + panel("Why they wait", "", bars(d.by_reason))
      + panel("How long they wait", "", bars(d.by_age.map(([k, v]) => [k, v, /days/.test(k) && v ? (k.startsWith("2") || k.startsWith("over") ? "bad" : "warn") : ""])))
      + panel("Waiting for", "RM of the CSP", bars(d.by_rm)) + `</div>`;
    },
    signals(d) {
      const c = d.causes, kinds = d.kinds.filter((k) => k.kind !== "S10_REVIEW_CAUSE");
      const week = kinds.reduce((a, k) => a + k.this_week, 0), last = kinds.reduce((a, k) => a + k.last_week, 0);
      const arrow = (a, b) => a > b ? `▲ from ${b}` : a < b ? `▼ from ${b}` : "same as last week";
      const where = (rows) => rows.map(([k, v]) => `${esc(String(k).replace(/_/g, " ").toLowerCase())} ${v}`).join(" · ");
      const cause = (x) => `<tr><td><b>${esc(x.cause)}</b>${x.fixable ? "" : ` <span class="small muted">(policy)</span>`}</td>
        <td class="num">${x.count}</td><td class="small">${where(x.type)}</td><td class="small">${where(x.how_read)}</td>
        <td class="small">${where(x.channel)}</td><td class="small">${where(x.state)}</td>
        <td class="small">${x.examples.map((e) => e.csp_id ? `<a href="#" data-csp="${e.csp_id}" title="${esc(e.detail)}">${esc(e.csp_code || e.csp_name || "CSP")}</a>` : `#${e.document_id}`).join(", ")}</td></tr>`;
      return band(d.status.level, week ? `${week} warning sign(s) this week` : "No warning signs this week", d.status.text,
        [`<span class="mx-chip">last collected ${ago(d.last_run)}</span>`, `<a class="mx-link" href="#" data-sigxlsx="1">Download Excel →</a>`])
      + strip(
        metric("Warning signs · 7 days", week, "", arrow(week, last)),
        metric("Sent to a person · 30 days", c.total, "", "Review items and unreadable files"),
        metric("Agent could fix", c.fixable_share == null ? "—" : Math.round(100 * c.fixable_share), c.fixable_share == null ? "" : "%",
               "the rest are policy checks", "", c.fixable_share > 0.5 ? "warn" : ""),
        metric("Strong signs · 30 days", kinds.reduce((a, k) => a + (k.strength === "strong" ? k.days_30 : 0), 0), "", "a mistake is likely"))
      + `<div class="mx-cols3">` + panel("Warning signs by kind", "This week; the agent finds these itself, nobody reviews anything",
          bars(kinds.map((k) => [k.label, k.this_week, k.strength === "strong" && k.this_week ? "bad" : ""]), "No warning signs yet."))
      + panel("Why documents went to a person", "Last 30 days", bars(c.by_cause.map((x) => [x.cause, x.count, x.fixable ? "warn" : ""]), "Nothing yet."))
      + panel("Same signs last week", "To compare", bars(kinds.map((k) => [k.label, k.last_week]), "Nothing last week.")) + `</div>`
      + panel("Where each cause comes from", "Document type, how it was read, channel and state; examples open the CSP",
          c.by_cause.length ? `<div class="tablewrap"><table><thead><tr><th>Cause</th><th class="num">Count</th><th>Type</th><th>How read</th>
            <th>Channel</th><th>State</th><th>Examples</th></tr></thead><tbody>${c.by_cause.map(cause).join("")}</tbody></table></div>`
          : `<p class="mx-hint">Nothing yet: the first collection runs at 03:00.</p>`);
    },
    experience(d) {
      return band(d.status.level, d.status.level === "ok" ? "No CSP got too many or wrong messages" : d.status.text,
        `Last ${d.days} days · ${d.csps_messaged} CSPs got ${d.messages} messages.`,
        [chip(d.while_in_review.length ? "bad" : "ok", `${d.while_in_review.length} messaged while in review`),
         chip(d.over_policy.length ? "warn" : "ok", `${d.over_policy.length} got 2+ on one day`)])
      + strip(
        metric(`CSPs messaged · ${d.days} days`, d.csps_messaged, "", `${d.messages} messages sent`),
        metric("2+ messages on one day", d.over_policy.length, "", "CSPs over the policy", "", d.over_policy.length ? "warn" : ""),
        metric("Messaged while being checked", d.while_in_review.length, "", "should always be 0", "", d.while_in_review.length ? "bad" : ""),
        metric("Told wrongly", d.wrong_negative_messages, "", "expired / unreadable / wrong document, later accepted", "", d.wrong_negative_messages ? "bad" : ""))
      + `<div class="mx-cols3">` + panel("Messages per CSP", `Last ${d.days} days`, bars(d.distribution.map(([k, v]) => [`${k} message${k === "1" ? "" : "s"}`, v, k === "8+" && v ? "warn" : ""])))
      + panel("CSPs to look at", "", kv([...d.while_in_review.map((c) => [code(c), chip("bad", "messaged while in review")]),
                                        ...d.over_policy.map((c) => [code(c), chip("warn", "2+ on one day")])], "None."))
      + panel(`Failed sends · ${d.failed}`, "", bars(d.failed_reasons, "None.")) + `</div>`;
    },
    messaging(d) {
      const handled = Object.values(d.handled_by_people).reduce((a, b) => a + b, 0);
      const level = d.oldest_waiting_hours >= 24 ? "warn" : "ok";
      return band(level, d.waiting_approval ? `${d.waiting_approval} message(s) waiting for approval` : "No message waiting for approval",
        d.oldest_waiting_hours != null ? `Oldest waits ${hrs(d.oldest_waiting_hours)}.` : "", [`<a class="mx-link" href="#" data-go="comms">Open Communication Hub →</a>`])
      + strip(
        metric(`Sent · ${d.days} days`, d.by_status.SENT || 0, "", `failed ${d.by_status.FAILED || 0} · rejected ${d.by_status.REJECTED || 0}`, spark(d.per_day.map((r) => r.sent || 0))),
        metric("Waiting for approval", d.waiting_approval, "", d.oldest_waiting_hours != null ? `oldest ${hrs(d.oldest_waiting_hours)}` : "", "", level === "ok" ? "" : level),
        metric("Handled by people", handled, "", Object.entries(d.handled_by_people).map(([k, v]) => `${k} ${v}`).join(" · ")),
        metric("Failed", d.by_status.FAILED || 0, "", "see CSP experience for why", "", (d.by_status.FAILED || 0) ? "warn" : ""))
      + `<div class="mx-cols">` + panel("Per day", "", columns(d.per_day, [["sent", "Sent", "--forest-light"], ["failed", "Failed", "--danger"]]))
      + `<div class="mx-stack">` + panel("By type", "", bars(d.by_type)) + panel("By state", "", bars(Object.entries(d.by_status).map(([k, v]) => [k.replaceAll("_", " ").toLowerCase(), v, k === "FAILED" ? "bad" : ""]))) + `</div></div>`;
    },
    network(d) {
      const c = d.coverage, r = d.renewals_due, m = d.moves_7d, L = d.labels_now, n = d.active_csps || 1;
      const l1 = d.series.map((s) => s["1"] || 0);
      const share = (k) => (100 * (L[k] || 0) / n).toFixed(1);
      return band(m.down > m.up ? "warn" : "ok", m.since ? `${m.up} CSP(s) moved towards Label 1 this week, ${m.down} moved down` : "Progress builds up from the daily snapshots",
        m.since ? `Compared with ${fmt(m.since)}.` : "The first comparison appears a day after the first snapshot.")
      + strip(
        metric("Label 1 now", L["1"] || 0, `/ ${d.active_csps}`, `${share("1")}% of active CSPs`, spark(l1, "ok")),
        metric("Moved up · 7 days", m.up, "", "towards Label 1", "", ""),
        metric("Moved down · 7 days", m.down, "", "a document expired or was rejected", "", m.down ? "warn" : ""),
        metric("Renewals in 30 days", Object.values(r).reduce((a, x) => a + x["30"], 0), "", "documents to renew soon", "", ""))
      + panel("Labels today", `${d.active_csps} active CSPs`, `<div class="mx-labels" role="img" aria-label="Labels">${["1", "2", "3", "4"].map((k) =>
          `<span style="width:${share(k)}%;background:var(--mx-l${k})"></span>`).join("")}</div>
        <div class="mx-legend">${["1", "2", "3", "4"].map((k) => `<span><i style="background:var(--mx-l${k})"></i>Label ${k} · ${L[k] || 0}</span>`).join("")}</div>`, "mx-wide")
      + `<div class="mx-cols">` + panel("Labels per day", "From the daily snapshots", columns(d.series, [["1", "Label 1", "--mx-l1"], ["2", "Label 2", "--mx-l2"], ["3", "Label 3", "--mx-l3"], ["4", "Label 4", "--mx-l4"]]))
      + panel("Each document", "", `<div class="tablewrap"><table class="mx-table"><thead><tr><th>Document</th><th class="r">Valid</th><th>Coverage</th><th class="r">Expired</th><th class="r">Due 30 / 60 / 90 d</th></tr></thead><tbody>
          ${Object.entries(c).map(([t, v]) => `<tr><td><b>${esc(T3[t] || t)}</b></td><td class="r">${v.valid}</td><td>${fill(v.percent, 100, v.percent >= 80 ? "ok" : v.percent >= 50 ? "warn" : "bad")}<span class="mx-note"> ${v.percent}%</span></td>
          <td class="r">${d.expired[t] || 0}</td><td class="r">${r[t]["30"]} / ${r[t]["60"]} / ${r[t]["90"]}</td></tr>`).join("")}</tbody></table></div>`)
      + `</div>` + panel("Sub-labels now", "", bars(d.sub_labels_now.map(([k, l, v]) => [`${k} ${l}`, v])), "mx-wide");
    },
    quality(d) {
      const k = d.counts, issues = k.no_phone + k.bad_phone + k.documents_file_missing;
      return band(k.documents_file_missing ? "bad" : issues ? "warn" : "ok", issues ? `${issues} record(s) need fixing` : "Records look complete",
        "Phones and RMs come from the calling sheet; fix them there.")
      + strip(
        metric("No phone", k.no_phone, "", "can't be messaged", "", k.no_phone ? "warn" : ""),
        metric("Phone looks wrong", k.bad_phone, "", "not a 10-digit mobile", "", k.bad_phone ? "warn" : ""),
        metric("Shared phone", k.shared_phone, "", "same number on several CSPs"),
        metric("Document file missing", k.documents_file_missing, "", "current documents", "", k.documents_file_missing ? "bad" : ""))
      + `<div class="mx-cols3">` + panel("No phone", "", d.no_phone.length ? `<p class="mx-codes">${d.no_phone.map(code).join(" ")}</p>` : `<p class="mx-hint">None.</p>`)
      + panel("Phone looks wrong / shared", "", [...d.bad_phone, ...d.shared_phone].length ? `<p class="mx-codes">${[...new Set([...d.bad_phone, ...d.shared_phone])].map(code).join(" ")}</p>` : `<p class="mx-hint">None.</p>`)
      + panel("Other", "", kv([["CSPs with no RM (TBA)", d.no_rm], ["Contact changes waiting", d.contact_changes_waiting], ["Active CSPs", d.active_csps]])) + `</div>`;
    },
    use(d) {
      const never = d.accounts.filter((u) => !u.last_login);
      return band(never.length ? "warn" : "ok", never.length ? `${never.length} account(s) have never signed in` : "Every dashboard account has signed in",
        "Totals only: no per-person pages, times or places are recorded.")
      + `<div class="mx-cols">` + panel(`Sign-ins per day · ${d.days} days`, "", columns(d.sign_ins_per_day.map(([day, n]) => ({day, n})), [["n", "Sign-ins", "--primary"]]))
      + `<div class="mx-stack">` + panel("Dashboard accounts", "", kv(d.accounts.map((u) => [`${esc(u.name)} <span class="mx-note">${esc(u.role)}</span>`, u.last_login ? `last ${fmt(u.last_login)}` : chip("warn", "never signed in")])))
      + panel("Open CSP questions", "", `<div class="mx-v">${d.open_csp_questions}</div><p><a class="mx-link" href="#" data-go="questions">Open CSP questions →</a></p>`)
      + `</div></div>`;
    },
  };

        <article class="card goal">

            : `<b class="bad">No progress this week</b> · the Agent Coach says why`}</div>${goalSpark(g.trend)}</div>
        </article>

        <article class="card kpi" data-go="review" role="button" tabindex="0"><div class="kpitop"><span class="kpilabel">Waiting in the Review queue</span><span class="kpiicon warn"><svg><use href="#i-inbox"/></svg></span></div><div class="kpival">${t.review_waiting}</div><div class="kpifoot">${t.review_waiting ? "a person decides these" : "nothing waiting ✓"}</div></article>

    async categories() {

      const subs = Object.entries(state.summary.sub_slabs || {}).filter(([k]) => k.startsWith(state.cat + "."));
      const tags = [["", "All"], ["expired", "Has an expired document"], ["unreachable", "Can't be reached (no phone or email)"], ["no_rm", "No RM assigned"]];
      const pages = Math.max(1, Math.ceil(d.total / d.size));
      return `
      <div class="tabs">${[1,2,3,4,5].map((k) => `<button data-cat="${k}" class="${state.cat === k ? "active" : ""}">${slab(k)} (${state.summary.categories[k] ?? 0})</button>`).join("")}</div>
      <div class="tabs"><button data-sub="" class="${!state.sub ? "active" : ""}">All with this label</button>${subs.map(([k, v]) => `<button data-sub="${k}" class="${state.sub === k ? "active" : ""}">${k} · ${esc(v.label)} (${v.count})</button>`).join("")}</div>
      <div class="tabs small">${tags.map(([k, l]) => `<button data-tag="${k}" class="${(state.tag || "") === k ? "active" : ""}">${l}${k ? ` (${state.summary.tags?.[k] ?? 0} overall)` : ""}</button>`).join("")}</div>
      <div class="toolbar"><input type="search" id="q" placeholder="Search code, name or phone" value="${esc(state.q)}">
        ${state.cat < 4 ? `<label class="small"><input type="checkbox" id="expiredonly" ${state.expiredOnly ? "checked" : ""}> only with an expired document (${state.summary.categories_with_expired?.[state.cat] ?? 0})</label>` : ""}
        <span class="muted small">${d.total} CSPs · ${CAT[state.cat][1]}</span>
        <a class="btn" href="#" data-xlsx="csp">Download CSP report (.xlsx)</a></div>
      ${state.cat === 5 && state.summary.me.role === "ADMIN" ? `<p class="small muted">If a CSP here is actually working, press <b>Make active</b>: they move to their Label and get reminders again, even though the calling sheet still says Inactive.</p>` : ""}
      <div class="card tablewrap">${d.rows.length ? `<table><thead><tr><th>CSP</th><th>Agreement</th><th>PVR</th><th>IIBF</th><th>RM / DC</th><th>Next action</th>${state.cat === 5 ? "<th></th>" : ""}</tr></thead><tbody>
        ${d.rows.map((r) => `<tr class="click" data-csp="${r.id}">
          <td><div class="mono">${esc(r.code)}</div><div>${esc(r.name)}</div><div class="small">${badge("c" + r.category, r.sub_slab_label)}</div><div class="small muted">${esc(r.reason)}</div></td>
          <td>${docCell(r.docs.AGREEMENT)}</td><td>${docCell(r.docs.POLICE_VERIFICATION)}</td><td>${docCell(r.docs.IIBF_CERTIFICATE)}</td>
          <td class="small">${esc(r.rm || "—")}<br><span class="muted">${esc(r.dc || "no DC")}</span></td>
          <td class="small mono">${fmt(r.next_action_at)}</td>${state.cat === 5 ? `<td>${state.summary.me.role === "ADMIN" ? `<button class="btn primary" data-makeactive="${r.id}">Make active</button>` : ""}</td>` : ""}</tr>`).join("")}
        </tbody></table>` : `<div class="empty">No CSPs with this label.</div>`}</div>
      ${pager(pages)}`;
    },

    async documents() {
      const uploads = state.docType === "UPLOADS";
      const d = await api(uploads ? `/api/hub/documents?channel=CSP_UPLOAD_PORTAL&size=300`
                                  : `/api/hub/documents?doc_type=${state.docType}&size=300`);
      return `
      <div class="tabs">${[["", "All"], ["AGREEMENT", "Agreements"], ["POLICE_VERIFICATION", "PVR / Character"], ["IIBF_CERTIFICATE", "IIBF"], ["UPLOADS", "Recent uploads by CSPs"]]
        .map(([k, l]) => `<button data-doctype="${k}" class="${state.docType === k ? "active" : ""}">${l}</button>`).join("")}</div>
      <p class="small muted">${uploads ? "Every file CSPs uploaded through their link, newest first, with what the agent read from it."
        : "Current documents per CSP, soonest expiry first. Expired ones stay listed in red with their dates. Unreadable files are kept for audit only and count as missing."}</p>
      <div class="card tablewrap"><table><thead><tr><th>CSP</th><th>Type</th><th>Status</th><th>Issued</th><th>Expires</th><th>Rule</th><th>Read by</th><th>Source</th><th></th></tr></thead><tbody>

        <td>${badge(r.readability === "UNREADABLE" ? "UNREADABLE" : r.status)}${r.reason && r.readability === "UNREADABLE" ? `<div class="small muted">${esc(r.reason)}</div>` : ""}</td>
        <td class="mono">${fmt(r.issue_date)}${r.typed_issue_date && r.typed_issue_date !== r.issue_date ? `<div class="small muted">typed ${fmt(r.typed_issue_date)}</div>` : ""}</td>
        <td class="mono">${r.expiry_date ? fmt(r.expiry_date) : (r.type === "IIBF_CERTIFICATE" ? "lifetime" : "—")}${r.days_left != null ? `<div class="small muted">${r.days_left < 0 ? -r.days_left + "d ago" : r.days_left + "d left"}</div>` : ""}</td>
        <td class="small">${esc((r.validity_rule || "").replaceAll("_", " ").toLowerCase())}<div class="muted">${esc((r.date_source || "").replaceAll("_", " ").toLowerCase())}</div></td>
        <td class="small">${r.model ? esc(r.model) : "rules"}</td>
        <td class="small">${esc(r.channel === "CSP_UPLOAD_PORTAL" ? "portal" : "gmail")}${r.sender_on_sheet === false ? `<div>${badge("PENDING", "sender not on sheet")}</div>` : ""}</td>
        <td><a href="#" data-file="${r.id}">view</a></td></tr>`).join("") || `<tr><td colspan="9" class="empty">No documents yet. Run the Gmail scan.</td></tr>`}
      </tbody></table></div>`;
    },

    async comms() {
      const d = await api(`/api/hub/messages?channel=${state.channel}&status=${state.msgStatus}&slab=${state.msgSlab || ""}&kind=${state.msgKind || ""}&size=100`);
      const kinds = [["", "All types"], ["renewal", "Renewal reminders"], ["expired", "Renew expired"], ["missing", "Upload missing"],

      <p class="small muted">${state.channel === "WHATSAPP" ? "The WhatsApp agent is send-only: it can't read replies, so a CSP's \"response\" is a new valid upload." : "Emails are sent from the connected Gmail account when approved."}

      <div class="tabs">${statuses.map(([k, l]) => `<button data-mstatus="${k}" class="${state.msgStatus === k ? "active" : ""}">${l} (${c[k] || 0})</button>`).join("")}</div>
      <div class="tabs"><button data-mslab="" class="${!state.msgSlab ? "active" : ""}">All labels (${allSlabs})</button>${[1,2,3,4].map((k) => `<button data-mslab="${k}" class="${+state.msgSlab === k ? "active" : ""}">${slab(k)} (${d.by_slab[k] || 0})</button>`).join("")}</div>
      <div class="tabs">${kinds.map(([k, l]) => `<button data-mkind="${k}" class="${(state.msgKind || "") === k ? "active" : ""}">${l} (${k ? d.by_kind[k] || 0 : allKinds})</button>`).join("")}</div>

      <div>${d.rows.map(msgCard).join("") || `<div class="card empty">Nothing here.</div>`}</div>`;
    },

      <div class="toolbar"><a class="btn" href="#" data-xlsx="contacts">Download contacts (.xlsx)</a>
        <a class="btn" href="#" data-xlsx="gaps">Download gaps (.xlsx)</a>

        ${d.staff.map((u) => `<tr><td>${esc(u.name)}</td><td>${esc(u.role)}</td><td class="num">${u.csps}</td>
          <td><input type="tel" value="${esc(u.phone || "")}" data-staff-phone="${u.id}" placeholder="10-digit mobile" size="12"></td>
          <td><input type="email" value="${esc(u.email || "")}" data-staff-email="${u.id}" placeholder="name@eko.co.in"></td>
          <td><button class="btn" data-savestaff="${u.id}">Save</button></td></tr>`).join("")}</tbody></table></div></div>
      <div class="grid k3" style="margin-top:14px">
        <div class="card tablewrap"><h2>CSP contact missing (${d.csp.length})</h2>${gapTable(d.csp, "Has", "x")}</div>
        <div class="card tablewrap"><h2>RM missing / no contact (${d.rm.length})</h2>${gapTable(d.rm, "RM", "rm")}</div>
        <div class="card tablewrap"><h2>DC missing / no contact (${d.dc.length})</h2>${gapTable(d.dc, "DC", "dc")}</div>

        ${d.change_requests.map((r) => `<tr><td class="click" data-csp="${r.csp_id}">#${r.csp_id}</td><td>${esc(r.field)}</td><td>${esc(r.old || "—")}</td><td><b>${esc(r.new)}</b></td>
          <td><button class="btn" data-cc="${r.id}/done">Done</button> <button class="btn" data-cc="${r.id}/dismiss">Dismiss</button></td></tr>`).join("")}</tbody></table>` : `<div class="empty">None.</div>`}</div>`;
    },

    async ingestion() {
      const s = state.summary.ingestion;
      const st = s.state || {};
      const d = await api("/api/hub/inbound?size=100");
      const u = await api("/api/hub/unmatched");
      const unmatchedCard = `<div class="card" style="margin-top:14px"><h2>Emails not matched to a CSP (${u.total})</h2>
        <p class="small muted">${u.counts.code_not_on_sheet} mention a CSP code that is not on the calling sheet · ${u.counts.report} are bulk reports (not about one CSP) · ${u.counts.no_code} have no CSP code at all.
          Add the missing codes to the calling sheet and the agent picks them up on the next scan.</p>
        <div class="toolbar"><a class="btn" href="#" data-xlsx="unmatched">Download list (.xlsx)</a></div>
        <div class="tablewrap">${u.codes.length ? `<table><thead><tr><th>CSP code not on sheet</th><th>Emails</th><th>Latest</th><th>Name in email</th><th>Subject</th></tr></thead><tbody>
          ${u.codes.map((e) => `<tr><td class="mono">${esc(e.code)}</td><td class="num">${e.emails}</td><td class="mono">${fmt(e.latest)}</td>
            <td>${esc(e.names.join(", ") || "—")}</td><td class="small">${esc(e.subjects[0] || "")}</td></tr>`).join("")}</tbody></table>` : `<div class="empty">None.</div>`}</div>
        <details style="margin-top:8px"><summary>Emails without a CSP code (${u.counts.no_code + u.counts.report})</summary>
          <div class="tablewrap"><table><thead><tr><th>Received</th><th>Subject</th><th>Sender</th></tr></thead><tbody>
          ${u.emails.filter((i) => i.kind !== "code_not_on_sheet").map((i) => `<tr><td class="mono">${fmt(i.received_at)}</td><td>${esc(i.subject || "")}${i.kind === "report" ? " " + badge("APPROVAL", "report") : ""}</td><td class="small">${esc(i.sender || "")}</td></tr>`).join("")}
          </tbody></table></div></details></div>`;
      return `
      <div class="grid k3">
        <div class="card"><h2>Gmail read-once status</h2><div class="kv">
          <dt>2-year backfill</dt><dd>${st.backfill_complete ? badge("DONE", "complete") : (st.backfill_started_at ? badge("PENDING", "in progress") : badge("PENDING", "not started"))}</dd>
          <dt>Messages listed</dt><dd class="num">${st.backfill_seen ?? 0}</dd>
          <dt>Started</dt><dd>${when(st.backfill_started_at)}</dd>
          <dt>Finished</dt><dd>${when(st.backfill_finished_at)}</dd>
          <dt>Last new-mail check</dt><dd>${when(st.last_incremental_at)}</dd></div>
          <p class="small muted">Each email is read once. Later scans fetch only mail added since the last check.</p>
          <button class="btn" data-run="gmail">Scan now</button></div>
        <div class="card"><h2>Emails by outcome</h2><div class="kv">${Object.entries(s.messages_by_status || {}).map(([k, v]) => `<dt>${badge(k)}</dt><dd class="num">${v}</dd>`).join("") || "<dt>none yet</dt><dd></dd>"}</div></div>
        <div class="card"><h2>Decisions per attachment</h2><p class="small muted">Readable → stored as current · Unreadable → kept in archive/, counts as missing · Not allowed → not stored (e.g. Aadhaar) · Duplicate → already on file.</p></div>
      </div>
      <div class="card tablewrap" style="margin-top:14px"><table><thead><tr><th>Received</th><th>Subject / sender</th><th>Outcome</th><th>Attachments</th></tr></thead><tbody>
      ${d.rows.map((i) => `<tr${i.csp_id ? ` class="click" data-csp="${i.csp_id}"` : ""}><td class="small mono">${when(i.received_at)}</td>
        <td><div>${esc(i.subject)}</div><div class="small muted">${esc(i.sender)}${i.sender_on_sheet === false ? " · " + badge("PENDING", "not on sheet") : ""}</div></td>
        <td>${badge(i.status)}<div class="small muted">${esc(i.note || "")}</div></td>
        <td class="small">${(i.decisions || []).map((a) => `<div>${badge(a.decision)} ${esc(a.filename)}${a.issue_date ? ` · <span class="mono">${fmt(a.issue_date)}</span>` : ""}</div>`).join("") || "—"}</td></tr>`).join("") || `<tr><td colspan="4" class="empty">No emails processed yet.</td></tr>`}
      </tbody></table></div>${unmatchedCard}`;
    },

    async monitoring() {
      const TABS = [["status", "Agent status"], ["documents", "Documents in"], ["accuracy", "Reading accuracy"],
                    ["review", "Review queue"], ["experience", "CSP experience"], ["messaging", "Messaging"],
                    ["network", "Network progress"], ["quality", "Data quality"], ["use", "Dashboard use"],
                    ["signals", "Agent's own warnings"]];
      const tab = state.mtab || "status";
      const d = await api(`/api/hub/monitor/${tab}`);
      const nav = `<div class="mx-tabs" role="tablist">${TABS.map(([v, l]) => `<button class="${tab === v ? "on" : ""}" role="tab" aria-selected="${tab === v}" data-mtab="${v}">${l}</button>`).join("")}</div>`;
      return `<div class="mx">${nav}${MON[tab] ? MON[tab](d) : `<div class="card empty">Unknown tab.</div>`}</div>`;
    },
    async accuracy() {
      const [a, rc] = await Promise.all([api("/api/hub/accuracy"), api("/api/hub/reading-check").catch(() => null)]);
      const pct = (v) => v == null ? "—" : v + "%";
      const row = (label, r) => `<tr><td>${esc(label)}</td><td class="num">${r.checked}</td><td class="num">${r.correct}</td>
        <td class="num">${r.date_wrong}</td><td class="num">${r.wrong_document}</td><td class="num"><b>${pct(r.accuracy)}</b></td></tr>`;
      const head = `<thead><tr><th></th><th>Checked</th><th>Correct</th><th>Date wrong</th><th>Wrong document / CSP</th><th>Accuracy</th></tr></thead>`;
      const T = {AGREEMENT: "CSP Agreement", POLICE_VERIFICATION: "PVR / Character certificate", IIBF_CERTIFICATE: "IIBF certificate"};
      return `${readingCheckCard(rc)}
      <h2 class="section-title">Checks by people</h2>
      <div class="grid k4">
        <div class="card kpi"><div class="label">Measured accuracy</div><div class="n">${pct(a.overall.accuracy)}</div>
          <div class="small muted">from ${a.overall.checked} checked documents</div></div>
        <div class="card kpi"><div class="label">Checks waiting</div><div class="n">${a.overall.pending}</div>
          <div class="small muted"><a href="#" data-go="review">Open the Review queue</a></div></div>
        <div class="card kpi"><div class="label">Accepted automatically</div><div class="n">${pct(a.recent_outcome["accepted automatically"]?.share)}</div>
          <div class="small muted">of ${a.recent_documents} documents in ${a.recent_days} days</div></div>
        <div class="card kpi"><div class="label">Spot-check rate</div><div class="n">${Math.round(a.spot_check_rate * 100)}%</div>
          <div class="small muted">of documents accepted automatically</div></div>
      </div>
      <p class="small muted" style="margin-top:10px">Accuracy is measured only from documents a person checked in the Review queue (spot checks and reference checks): Accept = read correctly, a changed date = date wrong, Reject = wrong document or CSP. The more checks, the more reliable the figure; aim for at least 100.</p>
      <div class="grid k3" style="margin-top:14px">
        <div class="card tablewrap"><h2>By document</h2><table>${head}<tbody>${Object.entries(a.by_type).map(([k, r]) => row(T[k] || k, r)).join("")}</tbody></table></div>
        <div class="card tablewrap"><h2>By how it was read</h2><table>${head}<tbody>${Object.entries(a.by_route).map(([k, r]) => row(k, r)).join("") || `<tr><td colspan="6" class="empty">No checks yet.</td></tr>`}</tbody></table></div>
        <div class="card"><h2>Last ${a.recent_days} days</h2><dl class="kv">
          ${Object.entries(a.recent_outcome).map(([k, v]) => `<dt>${esc(k)}</dt><dd class="num">${v.count} (${v.share}%)</dd>`).join("") || "<dt>No documents</dt><dd></dd>"}
          ${Object.entries(a.recent_reading).map(([k, v]) => `<dt>read from ${esc(k)}</dt><dd class="num">${v}</dd>`).join("")}</dl></div>
      </div>
      <div class="card tablewrap" style="margin-top:14px"><h2>Latest mistakes found</h2>${a.mistakes.length ? `<table><thead><tr><th>CSP</th><th>Document</th><th>Found</th><th>Read from</th><th></th></tr></thead><tbody>
        ${a.mistakes.map((m) => `<tr><td class="mono">${esc(m.csp)}</td><td>${esc(T[m.type] || m.type)}<div class="small muted">${esc(m.file || "")}</div></td>
          <td>${badge("EXPIRED", m.verdict)}</td><td class="small">${esc(m.how_read)}</td><td><a href="#" data-file="${m.document_id}">view</a></td></tr>`).join("")}</tbody></table>`
        : `<div class="empty">No mistakes found in the checks so far.</div>`}</div>`;
    },

    async analytics() {
      const a = await api("/api/hub/analytics?days=14");
      const pct = (n, d) => d ? Math.round(100 * n / d) + "%" : "—";
      const TYPES = {ONBOARD_ALL: "Onboarding (no documents)", UPLOAD_MISSING: "Documents missing", UPLOAD_EXPIRED: "Documents expired",
                     UNREADABLE_REUPLOAD: "Unreadable, re-upload", RENEWAL_NOTICE: "Renewal notice", RENEWAL_FOLLOWUP: "Renewal reminder",
                     RENEWAL_FINAL: "Renewal final", LINK_REQUEST: "Link the CSP asked for",
                     UPLOAD_RECEIPT: "Reply after upload", UPLOAD_SUCCESS_ALL: "All documents recorded"};
      const m = a.periods.last_30_days, w = a.periods.last_7_days, t = a.periods.today;
      const days = a.days.slice().reverse();
      const rate = (n, d) => d ? Math.round(100 * n / d) : null;
      const r30 = rate(m.any, m.csps_reached), acc30 = rate(m.accepted, m.csps_reached);
      const failed = (p) => p.whatsapp.failed + p.email.failed;
      const funnel = [["Messaged", m.csps_reached], ["Opened the link", m.opened], ["Submitted the form", m.submitted],
                      ["Documents accepted", m.accepted], ["Asked the RM a question", m.asked], ["Replied by email", m.email_reply]];
      return `<div class="mx">
      ${band(failed(w) ? "warn" : "ok", m.csps_reached ? `${r30}% of messaged CSPs responded in the last 30 days` : "No messages in the last 30 days",
        `Responded = within ${a.response_days} days of a message the CSP opened their link, submitted the form, asked a question or replied by email (India time; the test CSP is never counted).`,
        [chip(failed(w) ? "warn" : "ok", `${failed(w)} failed this week`), chip("ok", `${m.accepted} CSPs sent accepted documents`)])}
      ${strip(
        metric("WhatsApp today", t.whatsapp.sent, "", `${t.whatsapp.delivered} delivered · ${t.whatsapp.read} read`, spark(days.map((d) => d.whatsapp.sent))),
        metric("CSPs reached · 7 days", w.csps_reached, "", `${w.whatsapp.sent} WhatsApp · ${w.email.sent} email`),
        metric("Responded · 30 days", r30 ?? "—", r30 != null ? "%" : "", `${m.any} of ${m.csps_reached} CSPs`, fill(m.any, m.csps_reached, "ok")),
        metric("Documents accepted · 30 days", acc30 ?? "—", acc30 != null ? "%" : "", `${m.accepted} CSPs after a message`, fill(m.accepted, m.csps_reached, "ok")))}
      <div class="mx-cols">
        ${panel("Last 30 days: from message to documents", "Share of the CSPs messaged", bars(funnel.map(([l, n], i) => [`${l}${i ? ` · ${pct(n, m.csps_reached)}` : ""}`, n, i === 3 ? "ok" : ""])))}
        <div class="mx-stack">
          ${panel("Who sent them", "", bars(a.senders.map((x) => [x.who, x.whatsapp + x.email]), "Nothing sent yet."))}

          <th class="r">Reached</th><th class="r">Opened link</th><th class="r">Submitted</th><th class="r">Accepted</th><th class="r">Asked</th><th class="r">Email reply</th></tr></thead><tbody>

    async find() {
      const f = state.find;
      const d = await api(`/api/hub/find?${findQuery(f)}&page=${state.page}&size=50`);
      const sel = (key, label, opts) => `<label class="small">${label}<br><select data-fkey="${key}">${opts.map(([v, l]) =>
        `<option value="${v}" ${String(f[key] ?? "") === String(v) ? "selected" : ""}>${l}</option>`).join("")}</select></label>`;
      const rms = [["", "any"], ...(state.rms || []).map((n) => [n, n])];
      const pages = Math.max(1, Math.ceil(d.total / d.size));
      return `<p class="small muted">Pick a state for each document; "any" means it doesn't matter. Example: <i>only the agreement expired</i> = Agreement expired, PVR valid, IIBF valid. Expiring = valid but ends within 60 days.</p>
      <div class="tabs small">${FPRESETS.map(([l, p]) => `<button data-findset='${JSON.stringify(p)}'>${l}</button>`).join("")}<button data-findset='{}'>Clear</button></div>
      <div class="toolbar" style="flex-wrap:wrap;gap:12px">
        ${sel("agr", "Agreement", FSTATES)} ${sel("pvr", "PVR / Character", FSTATES)} ${sel("iibf", "IIBF", FSTATES.filter(([v]) => !["EXPIRING", "EXPIRED"].includes(v)))}
        ${sel("slab", "Label", [["", "any"], [1, "1"], [2, "2"], [3, "3"], [4, "4"]])}
        ${state.summary.me.role === "ADMIN" ? sel("rm", "RM", rms) : ""}
        ${sel("form", "Upload page", [["", "any"], ["yes", "used it"], ["no", "not used"], ["accepted", "all accepted"], ["partly", "partly accepted"], ["rejected", "tried, nothing accepted"]])}
        <span class="muted"><b>${d.total}</b> CSPs</span>
        <a class="btn" href="#" data-findxlsx="1">Download this list (.xlsx)</a></div>
      <div class="card tablewrap">${d.rows.length ? `<table><thead><tr><th>CSP</th><th>Agreement</th><th>PVR</th><th>IIBF</th><th>RM / DC</th><th>Upload page</th></tr></thead><tbody>
        ${d.rows.map((r) => `<tr class="click" data-csp="${r.id}">
          <td><div class="mono">${esc(r.code)}</div><div>${esc(r.name)}</div><div class="small">${badge("c" + r.category, r.sub_slab_label)}</div></td>
          <td>${docCell(r.docs.AGREEMENT)}</td><td>${docCell(r.docs.POLICE_VERIFICATION)}</td><td>${docCell(r.docs.IIBF_CERTIFICATE)}</td>
          <td class="small">${esc(r.rm || "—")}<br><span class="muted">${esc(r.dc || "no DC")}</span></td>
          <td class="small">${esc(r.form ? {accepted: "all accepted", partly: "partly", rejected: "nothing accepted"}[r.form] : "—")}</td></tr>`).join("")}
        </tbody></table>` : `<div class="empty">No CSPs match.</div>`}</div>
      ${pager(pages)}`;
    },

            ${x.filename ? `<span class="small muted"> · ${esc(x.filename)}</span>` : ""}</dd>`).join("")}</div>`;
      const attempt = (r, n) => `<div style="border-top:1px solid var(--border);padding-top:8px;margin-top:8px">

          ${results(r)}
          ${r.contact_changes ? `<div class="small" style="margin-top:6px">Also changed ${r.contact_changes} contact detail(s): see <a href="#" data-go="contacts">Contacts</a>.</div>` : ""}</div>`;
      return `${ml}<p class="small muted">One row per CSP who used the upload page: their latest result and their label now. Click <b>Show all attempts</b> to see every try — what they sent, what was accepted or turned away and why. <b>"Tried, nothing accepted"</b> are the CSPs to call first.</p>
      <div class="tabs">${[["", `All (${k.csps} CSPs)`], ["accepted", `All accepted (${k.accepted})`], ["checking", `Being checked (${k.checking})`], ["partly", `Partly (${k.partly})`], ["rejected", `Tried, nothing accepted (${k.rejected})`]]
        .map(([v, l]) => `<button class="tab ${out === v ? "active" : ""}" data-fout="${v}">${l}</button>`).join("")}</div>
      <div class="tabs">${[[0, "Any time"], [1, "Today"], [7, "Last 7 days"], [30, "Last 30 days"]]
        .map(([v, l]) => `<button class="tab ${days === v ? "active" : ""}" data-fdays="${v}">${l}</button>`).join("")}</div>
      ${shown.map((g) => { const last = g.attempts[0], n = g.attempts.length, isOpen = open.has(g.csp.id);
        return `<div class="card" style="margin-bottom:10px">
        <div class="meta">${badge(OUT[last.outcome][0], OUT[last.outcome][1])}
          <a href="#" data-csp="${g.csp.id}"><b class="mono">${esc(g.csp.code)}</b> ${esc(g.csp.name)}</a> · RM ${esc(g.rm || "-")}
          · now <b>${esc(slabTxt(g.csp.slab, g.csp.sub_slab))}</b>
          <span class="muted" style="margin-left:auto">${n} attempt${n > 1 ? "s" : ""} · last ${when(last.at)}</span></div>
        ${isOpen ? g.attempts.map((r, i) => attempt(r, n - i)).join("") : results(last)}
        <div style="margin-top:8px"><button class="btn" data-fcsp="${g.csp.id}">${isOpen ? "Hide attempts ▴" : (n > 1 ? `Show all ${n} attempts ▾` : "Show details ▾")}</button></div>
      </div>`; }).join("") || `<div class="card empty">No form submissions here yet.</div>`}`;
    },
