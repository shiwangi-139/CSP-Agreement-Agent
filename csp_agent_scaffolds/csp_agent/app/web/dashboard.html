<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Eko CSP Renewals</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&family=JetBrains+Mono:wght@500;600&family=Noto+Sans+Devanagari:wght@400;600&display=swap">
<link rel="stylesheet" href="static/eko.css?v=5">
</head>
<body>
<div id="login" class="login card" style="display:none">
  <img src="static/logo.png?v=2" alt="Eko" class="logo-img" style="height:28px;width:auto;max-width:110px;margin-bottom:8px" onerror="this.remove()">
  <h2>Eko CSP Renewals</h2>
  <p class="muted">Sign in with your Eko email and password.</p>
  <form id="loginf">
    <label>Email <input type="email" id="lemail" autocomplete="username" required style="width:100%"></label>
    <label>Password <input type="password" id="lpass" autocomplete="current-password" required style="width:100%"></label>
    <p class="small" id="lerr" style="color:#b42318"></p>
    <p><button class="btn primary">Sign in</button></p></form>
</div>

<div class="shell" id="app" style="display:none">
  <nav class="side" id="nav">
    <div class="brand"><img src="static/logo.png?v=2" alt="Eko" class="logo-img" style="height:20px;width:auto;max-width:72px"
      onerror="this.replaceWith(Object.assign(document.createElement('span'), {className: 'logo-text', innerHTML: 'eko<span>.</span>'}))">
      CSP Renewals</div>
    <div class="sub">SBI Kiosk Banking · document compliance</div>
    <button data-view="overview" class="active">Overview</button>
    <button data-view="categories">Labels <span class="count" id="n-cat"></span></button>
    <button data-view="documents">Latest documents</button>
    <button data-view="comms">Communication Hub <span class="count" id="n-drafts"></span></button>
    <button data-view="contacts">Contacts &amp; gaps</button>
    <button data-view="ingestion">Gmail ingestion</button>
    <button data-view="review">Review queue <span class="count" id="n-review"></span></button>
    <button data-view="analytics" id="nav-analytics" style="display:none">Messaging analytics</button>
    <button data-view="find">Find CSPs</button>
    <button data-view="formuploads">Form uploads <span class="count" id="n-form"></span></button>
    <button data-view="questions">CSP questions <span class="count" id="n-questions"></span></button>
    <button data-view="accuracy">Accuracy</button>
    <button data-view="monitoring">Monitoring</button>
    <div class="foot" id="modes"></div>
    <div class="foot" id="whoami"></div>
  </nav>
  <main>
    <div class="topbar">
      <h1 id="title">Overview</h1>
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
        <span class="pill warn" id="modepill"></span>
        <button class="btn" id="theme" title="Toggle light / dark">◐</button>
        <button class="btn" id="refresh">Refresh</button>
      </div>
    </div>
    <section id="view"></section>
  </main>
</div>

<div class="backdrop" id="backdrop"></div>
<aside class="drawer" id="drawer"></aside>
<div class="toast" id="toast"></div>

<script>
(() => {
  "use strict";
  const $ = (s, el = document) => el.querySelector(s);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const fmt = (iso) => iso ? iso.slice(0, 10).split("-").reverse().join("-") : "—";
  const when = (iso) => iso ? new Date(iso).toLocaleString("en-IN", {dateStyle: "medium", timeStyle: "short"}) : "—";
  const DOC = {AGREEMENT: "Agreement", POLICE_VERIFICATION: "PVR / Character", IIBF_CERTIFICATE: "IIBF"};
  const CAT = {1: ["All documents on file", "Agreement, PVR and IIBF all received"],
               2: ["1 document missing", "Two received, one missing or unreadable"],
               3: ["2 documents missing", "One received, two missing or unreadable"],
               4: ["No documents", "Nothing readable on file in 2 years"],
               5: ["Inactive", "Terminal Inactive on the calling sheet: no messages are sent"]};
  const slab = (k) => k === 5 ? "Inactive" : `Label ${k} · ${CAT[k][0]}`;          // "slab" is used elsewhere at Eko: users see "Label"
  // Find CSPs: one state per document; "" = any.
  const FSTATES = [["", "any"], ["VALID", "valid"], ["EXPIRING", "expiring ≤60d"], ["EXPIRED", "expired"], ["MISSING", "missing"], ["UNREADABLE", "unreadable"]];
  const FPRESETS = [
    ["Only agreement expired", {agr: "EXPIRED", pvr: "VALID", iibf: "VALID"}],
    ["Only PVR expired", {agr: "VALID", pvr: "EXPIRED", iibf: "VALID"}],
    ["Agreement expired (any other)", {agr: "EXPIRED"}],
    ["PVR expired (any other)", {pvr: "EXPIRED"}],
    ["Agreement expiring ≤60d", {agr: "EXPIRING"}],
    ["PVR expiring ≤60d", {pvr: "EXPIRING"}],
    ["Only IIBF missing", {agr: "VALID", pvr: "VALID", iibf: "MISSING"}],
    ["Everything valid", {agr: "VALID", pvr: "VALID", iibf: "VALID"}],
  ];
  const findQuery = (f) => ["agr", "pvr", "iibf", "slab", "rm", "form"].filter((k) => f[k]).map((k) => `${k}=${encodeURIComponent(f[k])}`).join("&");
  const state = {view: "overview", find: {}, cat: 1, q: "", expiredOnly: false, page: 1, channel: "WHATSAPP", msgStatus: "QUEUED_FOR_REVIEW", docType: "", summary: null};

  // ---------------------------------------------------------------- api
  // Paths are relative (no leading "/"): the page is served at "/" on the
  // server and at /csp-agreement-agent/admin/ through Nginx. The session is a
  // cookie; X-Requested-With proves the request comes from this page.
  const H = {"X-Requested-With": "csp-dashboard"};
  const rel = (path) => path.replace(/^\//, "");
  async function api(path, opts = {}) {
    const r = await fetch(rel(path), {...opts, credentials: "same-origin", headers: {"Content-Type": "application/json", ...H, ...(opts.headers || {})}});
    if (r.status === 401) { showLogin(); throw new Error("Unauthorised"); }
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.detail?.en || j.detail || r.statusText);
    return j;
  }
  const post = (path, body) => api(path, {method: "POST", body: JSON.stringify(body || {})});
  function toast(t) { const el = $("#toast"); el.textContent = t; el.style.display = "block"; clearTimeout(toast.t); toast.t = setTimeout(() => el.style.display = "none", 3200); }
  function showLogin() { $("#app").style.display = "none"; $("#login").style.display = "block"; }
  $("#loginf").onsubmit = async (e) => {
    e.preventDefault(); $("#lerr").textContent = "";
    const r = await fetch("auth/login", {method: "POST", credentials: "same-origin", headers: {"Content-Type": "application/json", ...H},
      body: JSON.stringify({email: $("#lemail").value.trim(), password: $("#lpass").value})});
    $("#lpass").value = "";
    if (!r.ok) { const j = await r.json().catch(() => ({})); $("#lerr").textContent = j.detail || "Sign-in failed."; return; }
    boot();
  };
  async function logout() { await fetch("auth/logout", {method: "POST", credentials: "same-origin", headers: H}); location.reload(); }

  // --------------------------------------------------------------- theme
  $("#theme").onclick = () => {
    const cur = document.documentElement.dataset.theme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    document.documentElement.dataset.theme = cur === "dark" ? "light" : "dark";
    try { localStorage.setItem("eko_theme", document.documentElement.dataset.theme); } catch (e) {}
  };
  try { const t = localStorage.getItem("eko_theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}

  // ----------------------------------------------------------- badges
  const badge = (s, label) => `<span class="b ${esc(s)}">${esc(label || String(s).replaceAll("_", " ").toLowerCase())}</span>`;
  function docCell(d) {
    if (!d) return "—";
    if (d.status === "VALID") {
      const soon = d.days_left != null && d.days_left <= 60;
      return `<span class="b ${soon ? "soon" : "VALID"}">${d.expiry_date ? (soon ? d.days_left + "d left" : "valid") : "valid · lifetime"}</span><div class="small muted mono">${d.expiry_date ? "exp " + fmt(d.expiry_date) : "iss " + fmt(d.issue_date)}</div>`;
    }
    if (d.status === "EXPIRED") return `${badge("EXPIRED", "expired")}<div class="small muted mono">exp ${fmt(d.expiry_date)}</div>`;
    return badge(d.status, d.status === "UNREADABLE" ? "unreadable" : "missing");
  }

  // ------------------------------------------------------- monitoring page
  // Shared look for Monitoring and Messaging analytics: one status band in
  // words, a strip of numbers that carry their own small chart, then panels.
  // Every status has an icon and words; colour only adds to them.
  const ICON = {ok: "✓", warn: "⚠", bad: "⛔"};
  const chip = (level, text) => `<span class="mx-chip ${esc(level)}">${ICON[level] || ""} ${esc(text)}</span>`;
  const mon = (s) => s ? chip(s.level, s.text) : "";
  // "6 min ago", "3 h ago", "2 days ago"; the full time on hover (title).
  function ago(iso) {
    if (!iso) return "never";
    const m = Math.max(0, (Date.now() - new Date(iso).getTime()) / 60000);
    const t = m < 1 ? "just now" : m < 60 ? `${Math.round(m)} min ago` : m < 2880 ? `${Math.round(m / 60)} h ago` : `${Math.round(m / 1440)} days ago`;
    return `<span title="${esc(when(iso))}">${t}</span>`;
  }
  function band(level, title, sub, chips = []) {
    return `<div class="mx-band ${esc(level)}"><div class="mx-dot" aria-hidden="true">${ICON[level] || "•"}</div>
      <div><b>${esc(title)}</b>${sub ? `<div class="mx-sub">${esc(sub)}</div>` : ""}</div>
      <div class="mx-chips">${chips.join("")}</div></div>`;
  }
  // One number in the strip: label, value (+ small unit), a mini chart, a note; level marks it with a top edge.
  const metric = (k, v, unit, note, viz = "", level = "") => `<div class="mx-metric ${esc(level)}"><span class="mx-k">${esc(k)}</span>
    <span class="mx-v">${v ?? "—"}${unit ? `<small> ${esc(unit)}</small>` : ""}</span>${viz}<span class="mx-note">${note || ""}</span></div>`;
  const strip = (...m) => `<div class="mx-strip">${m.join("")}</div>`;
  const panel = (title, hint, body, extra = "") => `<div class="mx-panel ${extra}"><h2>${esc(title)}</h2>${hint ? `<p class="mx-hint">${hint}</p>` : ""}${body}</div>`;
  // Mini charts (inline SVG, drawn to scale, colours from the theme).
  function fill(used, total, level = "") {
    const w = total ? Math.min(120, 120 * used / total) : 0;
    return `<svg class="mx-viz thin" viewBox="0 0 120 8" preserveAspectRatio="none" aria-hidden="true"><rect width="120" height="8" rx="4" class="mx-track"></rect>
      <rect width="${w}" height="8" rx="4" class="mx-fill ${esc(level)}"></rect></svg>`;
  }
  function spark(values, level = "") {
    const v = (values || []).filter((x) => x != null);
    if (v.length < 2) return `<svg class="mx-viz" viewBox="0 0 120 24" aria-hidden="true"></svg>`;
    const max = Math.max(...v), min = Math.min(...v), span = max - min || 1;
    const pts = v.map((x, i) => [i * 120 / (v.length - 1), 21 - 18 * (x - min) / span]);
    const line = pts.map((p) => p.map((n) => n.toFixed(1)).join(",")).join(" ");
    const [ex, ey] = pts[pts.length - 1];
    return `<svg class="mx-viz" viewBox="0 0 120 24" aria-hidden="true"><polygon points="0,24 ${line} 120,24" class="mx-area ${esc(level)}"></polygon>
      <polyline points="${line}" class="mx-line ${esc(level)}"></polyline><circle cx="${ex.toFixed(1)}" cy="${ey.toFixed(1)}" r="2.6" class="mx-end ${esc(level)}"></circle></svg>`;
  }
  function blocks(levels) {
    const n = levels.length || 1, w = 120 / n;
    return `<svg class="mx-viz thin" viewBox="0 0 120 8" preserveAspectRatio="none" aria-hidden="true">${levels.map((l, i) =>
      `<rect x="${(i * w + 1).toFixed(1)}" width="${(w - 2).toFixed(1)}" height="8" rx="2" class="mx-fill ${esc(l)}"></rect>`).join("")}</svg>`;
  }
  // Horizontal bars: [[label, value, level?], ...], value written at the end of each bar.
  function bars(rows, empty = "Nothing yet.") {
    if (!rows || !rows.length) return `<p class="mx-hint">${empty}</p>`;
    const max = Math.max(...rows.map((r) => r[1]), 1);
    return `<div class="mx-bars">${rows.map(([l, v, lev]) => `<div class="mx-bar"><span class="mx-bl">${esc(l)}</span>
      <span class="mx-bt"><span class="mx-fillbar ${esc(lev || "")}" style="width:${v ? Math.max(2, 100 * v / max) : 0}%"></span></span><span class="mx-bv">${v}</span></div>`).join("")}</div>`;
  }
  // Columns per day, stacked: series [{day, key: n}], keys [[key, label, cssVar]].
  function columns(series, keys) {
    if (!series || !series.length) return `<p class="mx-hint">No history yet: it builds up day by day.</p>`;
    const tot = series.map((r) => keys.reduce((a, [k]) => a + (r[k] || 0), 0)), max = Math.max(...tot, 1);
    const W = 300, H = 110, gap = 2, w = Math.max(3, (W - 30) / series.length - gap);
    const x = (i) => 28 + i * (w + gap);
    const grid = [0.5, 1].map((f) => `<line x1="28" x2="${W}" y1="${H - H * f + 4}" y2="${H - H * f + 4}" class="mx-grid"></line>
      <text x="24" y="${H - H * f + 8}" text-anchor="end">${Math.round(max * f)}</text>`).join("");
    const cols = series.map((r, i) => { let y = H + 4; return keys.map(([k, , col]) => { const h = H * (r[k] || 0) / max; y -= h;
      return h ? `<rect x="${x(i).toFixed(1)}" y="${y.toFixed(1)}" width="${w.toFixed(1)}" height="${h.toFixed(1)}" rx="1.5" style="fill:var(${col})"><title>${esc(r.day)} · ${esc(k)}: ${r[k]}</title></rect>` : ""; }).join(""); }).join("");
    return `<svg class="mx-chart" viewBox="0 0 ${W} ${H + 22}" role="img" aria-label="per day">${grid}${cols}
      <text x="28" y="${H + 18}">${esc(fmt(series[0].day))}</text><text x="${W}" y="${H + 18}" text-anchor="end">${esc(fmt(series[series.length - 1].day))}</text></svg>
      <div class="mx-legend">${keys.map(([, l, col]) => `<span><i style="background:var(${col})"></i>${esc(l)}</span>`).join("")}</div>`;
  }
  // Timeline of a job's runs in the last 24 h (left = 24 h ago, right = now).
  function ribbon(runs) {
    return `<svg class="mx-ribbon" viewBox="0 0 120 12" preserveAspectRatio="none" aria-label="${runs.length} runs in 24 h" role="img">
      <rect width="120" height="12" rx="3" class="mx-track"></rect>${runs.map((r) =>
      `<rect x="${(118 - 118 * Math.min(r.hours_ago, 24) / 24).toFixed(1)}" y="1" width="2" height="10" class="mx-fill ${r.status === "FAILED" ? "bad" : r.status === "SKIPPED" ? "" : "ok"}"></rect>`).join("")}</svg>`;
  }
  const kv = (rows, empty = "Nothing yet.") => rows && rows.length
    ? `<dl class="mx-kv">${rows.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join("")}</dl>` : `<p class="mx-hint">${empty}</p>`;
  const code = (c) => `<span class="mx-code">${esc(c)}</span>`;
  const T3 = {AGREEMENT: "Agreement", POLICE_VERIFICATION: "Police certificate", IIBF_CERTIFICATE: "IIBF"};
  const hrs = (h) => h == null ? "—" : h >= 48 ? `${Math.round(h / 24)} days` : `${Math.round(h)} h`;

  const MON = {
    status(d) {
      const late = d.jobs.filter((j) => j.status.level !== "ok");
      const chips = [...late.map((j) => chip(j.status.level, `${j.label}: ${j.status.text}`)),
                     ...(d.whatsapp.status.level !== "ok" ? [mon(d.whatsapp.status)] : [])];
      const title = d.overall.level === "ok" ? "Everything ran on time" : d.overall.text;
      const wa = d.whatsapp, rh = d.review_helper, okJobs = d.jobs.length - late.length;
      return band(d.overall.level, title, late.length ? "Jobs below are late or failed; the rest ran normally." : "All jobs ran when they should.", chips)
      + strip(
        metric("WhatsApp today", wa.today, `/ ${wa.limit}`, `${esc(wa.mode)} mode · ${wa.send_window_open ? "sending now" : "outside"} ${esc(wa.send_hours)}`,
               fill(wa.today, wa.limit, wa.status.level), wa.status.level === "ok" ? "" : wa.status.level),
        metric("Last Gmail scan", d.gmail.last_scan ? ago(d.gmail.last_scan.at) : "never", "", d.gmail.backfill_done ? "2-year backfill done" : "backfill still running"),
        metric("Review helper", rh.read_today, `/ ${rh.limit}`, rh.on ? "local AI · 8 pm to 8 am" : "switched off", fill(rh.read_today, rh.limit)),
        metric("Jobs on time", okJobs, `/ ${d.jobs.length}`, late.length ? `${late.length} need a look` : "none late or failed",
               blocks(d.jobs.map((j) => j.status.level)), late.some((j) => j.status.level === "bad") ? "bad" : late.length ? "warn" : ""))
      + `<div class="mx-cols">` + panel("Jobs", "Each job's runs over the last 24 hours (right edge = now). Late = no run for longer than it should be.",
        `<div class="tablewrap"><table class="mx-table"><thead><tr><th>Job</th><th>Status</th><th>Last 24 h</th><th>Last run</th><th class="r">Took</th></tr></thead><tbody>
        ${d.jobs.map((j) => `<tr><td><b>${esc(j.label)}</b>${j.last_error ? `<div class="mx-err">${esc(j.last_error)}</div>` : ""}</td><td>${mon(j.status)}</td>
          <td>${ribbon(j.runs_24h || [])}</td><td class="mx-when">${j.last ? ago(j.last.at) : "—"}</td>
          <td class="r mx-when">${j.last?.minutes == null ? "—" : j.last.minutes < 1 ? "under 1 min" : j.last.minutes + " min"}</td></tr>`).join("")}</tbody></table></div>`)
      + panel("Gmail messages", "By what happened to them", bars(Object.entries(d.gmail.messages_by_status || {}).map(([k, v]) => [k.replaceAll("_", " ").toLowerCase(), v, k.includes("ERROR") || k.includes("FAIL") ? "bad" : ""])))
      + `</div>`;
    },
    documents(d) {
      const up = d.upload_page, o = d.outcome;
      const days = d.per_day.map((r) => (r.gmail || 0) + (r["upload page"] || 0));
      return band(up.csps_tried_twice_nothing_accepted ? "warn" : "ok",
        up.csps_tried_twice_nothing_accepted ? `${up.csps_tried_twice_nothing_accepted} CSP(s) tried twice and nothing was accepted` : "No CSP is stuck on the upload page",
        up.csps_tried_twice_nothing_accepted ? "Call them first: see Form uploads → Tried, nothing accepted." : `${d.total} documents came in over ${d.days} days.`)
      + strip(
        metric(`Documents · ${d.days} days`, d.total, "", "Gmail and the upload page", spark(days)),
        metric("Accepted", o.accepted || 0, "", `in review ${o["in review"] || 0} · unreadable ${o.unreadable || 0}`, fill(o.accepted || 0, d.total, "ok")),
        metric("Upload page files", up.files || 0, "", `${up.submissions || 0} submissions`),
        metric("Turned away", (up.turned_away_reasons || []).reduce((a, r) => a + r[1], 0), "", "reasons below", "", (up.turned_away_reasons || []).length ? "warn" : ""))
      + `<div class="mx-cols">` + panel("Per day", "", columns(d.per_day, [["gmail", "Gmail", "--primary"], ["upload page", "Upload page", "--forest-light"]]))
      + `<div class="mx-stack">` + panel("By document", "", bars(Object.entries(d.by_type).map(([k, v]) => [T3[k] || k, v])))
      + panel("Why files were turned away", "Upload page", bars(up.turned_away_reasons, "None."))
      + `</div></div>`;
    },
    accuracy(d) {
      const sc = d.spot_checks || {}, wr = d.wrong_rejections, ev = d.evaluations[0], ck = d.document_checks[0];
      const all = ev?.summary?.by_type?.ALL;
      const hist = d.evaluations.slice().reverse().map((r) => r.summary?.by_type?.ALL?.correct_or_safe_percent);
      const bad = wr.count + d.wrong_acceptances + (all ? all["WRONG ACCEPT"] || 0 : 0);
      const head = !ev ? band("warn", "No reading evaluation yet", "Run it on the server: python -m scripts.eval_reading")
        : band((all?.["WRONG ACCEPT"] || 0) ? "bad" : (all?.["wrong reject"] || 0) ? "warn" : "ok",
          (all?.["WRONG ACCEPT"] || 0) ? `${all["WRONG ACCEPT"]} document(s) accepted with a wrong date` : "No wrong acceptances in the latest evaluation",
          `${all?.documents ?? 0} documents a person decided, read again ${ago(ev.at)} with code ${ev.summary.commit || "?"}.`,
          [chip((all?.["WRONG ACCEPT"] || 0) ? "bad" : "ok", `${all?.["WRONG ACCEPT"] || 0} wrong accepts`),
           chip((all?.["wrong reject"] || 0) ? "warn" : "ok", `${all?.["wrong reject"] || 0} wrong rejects`)]);
      const evRows = ev ? Object.entries(ev.summary.by_type || {}).filter(([t]) => t !== "ALL").map(([t, s]) => `<tr><td><b>${esc(T3[t] || t)}</b></td>
        <td class="r">${s.documents}</td><td class="r">${s.correct || 0}</td><td class="r">${s["safe review"] || 0}</td>
        <td class="r">${(s["WRONG ACCEPT"] || 0) ? chip("bad", s["WRONG ACCEPT"]) : chip("ok", "0")}</td>
        <td class="r">${(s["wrong reject"] || 0) ? chip("warn", s["wrong reject"]) : "0"}</td></tr>`).join("") : "";
      return head + strip(
        metric("Correct or safely reviewed", all?.correct_or_safe_percent ?? "—", all ? "%" : "", "latest evaluation", spark(hist, "")),
        metric("Spot-check accuracy", sc.accuracy ?? "—", sc.accuracy != null ? "%" : "", `${sc.checked || 0} checked by a person`),
        metric("CSPs told wrongly", wr.count, "", `of ${wr.of_turned_away} turned-away uploads`, "", wr.count ? "bad" : ""),
        metric("Validity only a default", d.default_validity.count, "", "current documents, no stated validity", "", d.default_validity.count ? "warn" : ""))
      + `<div class="mx-cols">` + panel("Latest evaluation by document", ev ? `${esc(ev.summary.set)} set · documents a person decided are the correct answers` : "",
        ev ? `<div class="tablewrap"><table class="mx-table"><thead><tr><th>Document</th><th class="r">Checked</th><th class="r">Correct</th><th class="r">Safe review</th><th class="r">Wrong accept</th><th class="r">Wrong reject</th></tr></thead><tbody>${evRows}</tbody></table></div>`
           : `<p class="mx-hint">Not run yet.</p>`)
      + `<div class="mx-stack">` + panel("Latest full document check", ck ? ago(ck.at) : "", ck ? bars([["same", ck.summary.same || 0, "ok"], ["different", ck.summary.DIFFERENT || 0, "warn"], ["review", ck.summary.review || 0], ["reads as another", ck.summary["reads as another"] || 0, "warn"], ["not readable", ck.summary["not readable"] || 0, "bad"], ["timeout", ck.summary.timeout || 0, "bad"]].filter((r) => r[1])) : `<p class="mx-hint">Not run yet.</p>`)
      + panel("CSPs told wrongly (latest)", "Turned away, later accepted", kv(wr.examples.map((x) => [code(x.csp), `${esc(x.section)} · ${esc(x.reason)}`]), "None."))
      + `</div></div>` + panel("Where validity came from", "Current accepted documents", bars(d.rules_used.map((r) => [`${T3[r.type] || r.type} · ${r.rule.replaceAll("_", " ").toLowerCase()}`, r.documents, r.rule.includes("DEFAULT") ? "warn" : ""])), "mx-wide");
    },
    review(d) {
      const total = Object.values(d.decided_30d).reduce((a, b) => a + b, 0);
      return band(d.status.level, d.waiting ? `${d.waiting} document(s) waiting for a person` : "Nothing waiting", d.status.text,
        [`<a class="mx-link" href="#" data-go="review">Open the Review queue →</a>`])
      + strip(
        metric("Waiting", d.waiting, "", "documents and checks"),
        metric("Oldest waits", hrs(d.oldest_hours), "", "⚠ after 1 day · ⛔ after 2", "", d.status.level === "ok" ? "" : d.status.level),
        metric("Median time to decide", d.median_hours_to_decision ?? "—", d.median_hours_to_decision != null ? "h" : "", "last 30 days"),
        metric("Decided · 30 days", total, "", Object.entries(d.decided_30d).map(([k, v]) => `${k.toLowerCase()} ${v}`).join(" · ")))
      + `<div class="mx-cols3">` + panel("Why they wait", "", bars(d.by_reason))
      + panel("How long they wait", "", bars(d.by_age.map(([k, v]) => [k, v, /days/.test(k) && v ? (k.startsWith("2") || k.startsWith("over") ? "bad" : "warn") : ""])))
      + panel("Waiting for", "RM of the CSP", bars(d.by_rm)) + `</div>`;
    },
    experience(d) {
      return band(d.status.level, d.status.level === "ok" ? "No CSP got too many or wrong messages" : d.status.text,
        `Last ${d.days} days · ${d.csps_messaged} CSPs got ${d.messages} messages.`,
        [chip(d.while_in_review.length ? "bad" : "ok", `${d.while_in_review.length} messaged while in review`),
         chip(d.over_policy.length ? "warn" : "ok", `${d.over_policy.length} got 2+ on one day`)])
      + strip(
        metric(`CSPs messaged · ${d.days} days`, d.csps_messaged, "", `${d.messages} messages sent`),
        metric("2+ messages on one day", d.over_policy.length, "", "CSPs over the policy", "", d.over_policy.length ? "warn" : ""),
        metric("Messaged while being checked", d.while_in_review.length, "", "should always be 0", "", d.while_in_review.length ? "bad" : ""),
        metric("Told wrongly", d.wrong_negative_messages, "", "expired / unreadable / wrong document, later accepted", "", d.wrong_negative_messages ? "bad" : ""))
      + `<div class="mx-cols3">` + panel("Messages per CSP", `Last ${d.days} days`, bars(d.distribution.map(([k, v]) => [`${k} message${k === "1" ? "" : "s"}`, v, k === "8+" && v ? "warn" : ""])))
      + panel("CSPs to look at", "", kv([...d.while_in_review.map((c) => [code(c), chip("bad", "messaged while in review")]),
                                        ...d.over_policy.map((c) => [code(c), chip("warn", "2+ on one day")])], "None."))
      + panel(`Failed sends · ${d.failed}`, "", bars(d.failed_reasons, "None.")) + `</div>`;
    },
    messaging(d) {
      const handled = Object.values(d.handled_by_people).reduce((a, b) => a + b, 0);
      const level = d.oldest_waiting_hours >= 24 ? "warn" : "ok";
      return band(level, d.waiting_approval ? `${d.waiting_approval} message(s) waiting for approval` : "No message waiting for approval",
        d.oldest_waiting_hours != null ? `Oldest waits ${hrs(d.oldest_waiting_hours)}.` : "", [`<a class="mx-link" href="#" data-go="comms">Open Communication Hub →</a>`])
      + strip(
        metric(`Sent · ${d.days} days`, d.by_status.SENT || 0, "", `failed ${d.by_status.FAILED || 0} · rejected ${d.by_status.REJECTED || 0}`, spark(d.per_day.map((r) => r.sent || 0))),
        metric("Waiting for approval", d.waiting_approval, "", d.oldest_waiting_hours != null ? `oldest ${hrs(d.oldest_waiting_hours)}` : "", "", level === "ok" ? "" : level),
        metric("Handled by people", handled, "", Object.entries(d.handled_by_people).map(([k, v]) => `${k} ${v}`).join(" · ")),
        metric("Failed", d.by_status.FAILED || 0, "", "see CSP experience for why", "", (d.by_status.FAILED || 0) ? "warn" : ""))
      + `<div class="mx-cols">` + panel("Per day", "", columns(d.per_day, [["sent", "Sent", "--forest-light"], ["failed", "Failed", "--danger"]]))
      + `<div class="mx-stack">` + panel("By type", "", bars(d.by_type)) + panel("By state", "", bars(Object.entries(d.by_status).map(([k, v]) => [k.replaceAll("_", " ").toLowerCase(), v, k === "FAILED" ? "bad" : ""]))) + `</div></div>`;
    },
    network(d) {
      const c = d.coverage, r = d.renewals_due, m = d.moves_7d, L = d.labels_now, n = d.active_csps || 1;
      const l1 = d.series.map((s) => s["1"] || 0);
      const share = (k) => (100 * (L[k] || 0) / n).toFixed(1);
      return band(m.down > m.up ? "warn" : "ok", m.since ? `${m.up} CSP(s) moved towards Label 1 this week, ${m.down} moved down` : "Progress builds up from the daily snapshots",
        m.since ? `Compared with ${fmt(m.since)}.` : "The first comparison appears a day after the first snapshot.")
      + strip(
        metric("Label 1 now", L["1"] || 0, `/ ${d.active_csps}`, `${share("1")}% of active CSPs`, spark(l1, "ok")),
        metric("Moved up · 7 days", m.up, "", "towards Label 1", "", ""),
        metric("Moved down · 7 days", m.down, "", "a document expired or was rejected", "", m.down ? "warn" : ""),
        metric("Renewals in 30 days", Object.values(r).reduce((a, x) => a + x["30"], 0), "", "documents to renew soon", "", ""))
      + panel("Labels today", `${d.active_csps} active CSPs`, `<div class="mx-labels" role="img" aria-label="Labels">${["1", "2", "3", "4"].map((k) =>
          `<span style="width:${share(k)}%;background:var(--mx-l${k})"></span>`).join("")}</div>
        <div class="mx-legend">${["1", "2", "3", "4"].map((k) => `<span><i style="background:var(--mx-l${k})"></i>Label ${k} · ${L[k] || 0}</span>`).join("")}</div>`, "mx-wide")
      + `<div class="mx-cols">` + panel("Labels per day", "From the daily snapshots", columns(d.series, [["1", "Label 1", "--mx-l1"], ["2", "Label 2", "--mx-l2"], ["3", "Label 3", "--mx-l3"], ["4", "Label 4", "--mx-l4"]]))
      + panel("Each document", "", `<div class="tablewrap"><table class="mx-table"><thead><tr><th>Document</th><th class="r">Valid</th><th>Coverage</th><th class="r">Expired</th><th class="r">Due 30 / 60 / 90 d</th></tr></thead><tbody>
          ${Object.entries(c).map(([t, v]) => `<tr><td><b>${esc(T3[t] || t)}</b></td><td class="r">${v.valid}</td><td>${fill(v.percent, 100, v.percent >= 80 ? "ok" : v.percent >= 50 ? "warn" : "bad")}<span class="mx-note"> ${v.percent}%</span></td>
          <td class="r">${d.expired[t] || 0}</td><td class="r">${r[t]["30"]} / ${r[t]["60"]} / ${r[t]["90"]}</td></tr>`).join("")}</tbody></table></div>`)
      + `</div>` + panel("Sub-labels now", "", bars(d.sub_labels_now.map(([k, l, v]) => [`${k} ${l}`, v])), "mx-wide");
    },
    quality(d) {
      const k = d.counts, issues = k.no_phone + k.bad_phone + k.documents_file_missing;
      return band(k.documents_file_missing ? "bad" : issues ? "warn" : "ok", issues ? `${issues} record(s) need fixing` : "Records look complete",
        "Phones and RMs come from the calling sheet; fix them there.")
      + strip(
        metric("No phone", k.no_phone, "", "can't be messaged", "", k.no_phone ? "warn" : ""),
        metric("Phone looks wrong", k.bad_phone, "", "not a 10-digit mobile", "", k.bad_phone ? "warn" : ""),
        metric("Shared phone", k.shared_phone, "", "same number on several CSPs"),
        metric("Document file missing", k.documents_file_missing, "", "current documents", "", k.documents_file_missing ? "bad" : ""))
      + `<div class="mx-cols3">` + panel("No phone", "", d.no_phone.length ? `<p class="mx-codes">${d.no_phone.map(code).join(" ")}</p>` : `<p class="mx-hint">None.</p>`)
      + panel("Phone looks wrong / shared", "", [...d.bad_phone, ...d.shared_phone].length ? `<p class="mx-codes">${[...new Set([...d.bad_phone, ...d.shared_phone])].map(code).join(" ")}</p>` : `<p class="mx-hint">None.</p>`)
      + panel("Other", "", kv([["CSPs with no RM (TBA)", d.no_rm], ["Contact changes waiting", d.contact_changes_waiting], ["Active CSPs", d.active_csps]])) + `</div>`;
    },
    use(d) {
      const never = d.accounts.filter((u) => !u.last_login);
      return band(never.length ? "warn" : "ok", never.length ? `${never.length} account(s) have never signed in` : "Every dashboard account has signed in",
        "Totals only: no per-person pages, times or places are recorded.")
      + `<div class="mx-cols">` + panel(`Sign-ins per day · ${d.days} days`, "", columns(d.sign_ins_per_day.map(([day, n]) => ({day, n})), [["n", "Sign-ins", "--primary"]]))
      + `<div class="mx-stack">` + panel("Dashboard accounts", "", kv(d.accounts.map((u) => [`${esc(u.name)} <span class="mx-note">${esc(u.role)}</span>`, u.last_login ? `last ${fmt(u.last_login)}` : chip("warn", "never signed in")])))
      + panel("Open CSP questions", "", `<div class="mx-v">${d.open_csp_questions}</div><p><a class="mx-link" href="#" data-go="questions">Open CSP questions →</a></p>`)
      + `</div></div>`;
    },
  };

  // ------------------------------------------------------------- views

      </div>

          <dt>Not yet labelled</dt><dd class="num">${s.uncategorised}</dd></div>
          <p class="small muted">Labels refresh on every run of the daily engine (09:00 IST) and on every upload.</p></div>
        <div class="card"><h2>Contact gaps</h2>
          <div class="kv"><dt>CSP without phone</dt><dd class="num">${s.contact_gaps.csp_phone}</dd>
          <dt>CSP without email</dt><dd class="num">${s.contact_gaps.csp_email}</dd>
          <dt>No RM assigned</dt><dd class="num">${s.contact_gaps.rm_unassigned}</dd>
          <dt>No DC assigned</dt><dd class="num">${s.contact_gaps.dc_unassigned}</dd></div>

      <div class="tabs">${[["", "All"], ["AGREEMENT", "Agreements"], ["POLICE_VERIFICATION", "PVR / Character"], ["IIBF_CERTIFICATE", "IIBF"], ["UPLOADS", "Recent uploads by CSPs"]]

        <td class="small">${esc(r.channel === "CSP_UPLOAD_PORTAL" ? "portal" : "gmail")}${r.sender_on_sheet === false ? `<div>${badge("PENDING", "sender not on sheet")}</div>` : ""}</td>

    async comms() {

                     ["upload_reply", "Replies after upload"]];
      const allKinds = Object.values(d.by_kind).reduce((a, b) => a + b, 0);

      <div class="tabs"><button data-mslab="" class="${!state.msgSlab ? "active" : ""}">All labels (${allSlabs})</button>${[1,2,3,4].map((k) => `<button data-mslab="${k}" class="${+state.msgSlab === k ? "active" : ""}">${slab(k)} (${d.by_slab[k] || 0})</button>`).join("")}</div>
      <div class="tabs">${kinds.map(([k, l]) => `<button data-mkind="${k}" class="${(state.msgKind || "") === k ? "active" : ""}">${l} (${k ? d.by_kind[k] || 0 : allKinds})</button>`).join("")}</div>

      <div>${d.rows.map(msgCard).join("") || `<div class="card empty">Nothing here.</div>`}</div>`;
    },

        <div class="card"><h2>Decisions per attachment</h2><p class="small muted">Readable → stored as current · Unreadable → kept in archive/, counts as missing · Not allowed → not stored (e.g. Aadhaar) · Duplicate → already on file.</p></div>

    async monitoring() {

                    ["review", "Review queue"], ["experience", "CSP experience"], ["messaging", "Messaging"],
                    ["network", "Network progress"], ["quality", "Data quality"], ["use", "Dashboard use"]];

      const nav = `<div class="mx-tabs" role="tablist">${TABS.map(([v, l]) => `<button class="${tab === v ? "on" : ""}" role="tab" aria-selected="${tab === v}" data-mtab="${v}">${l}</button>`).join("")}</div>`;
      return `<div class="mx">${nav}${MON[tab] ? MON[tab](d) : `<div class="card empty">Unknown tab.</div>`}</div>`;
    },
    async accuracy() {
      const a = await api("/api/hub/accuracy");
      const pct = (v) => v == null ? "—" : v + "%";
      const row = (label, r) => `<tr><td>${esc(label)}</td><td class="num">${r.checked}</td><td class="num">${r.correct}</td>
        <td class="num">${r.date_wrong}</td><td class="num">${r.wrong_document}</td><td class="num"><b>${pct(r.accuracy)}</b></td></tr>`;
      const head = `<thead><tr><th></th><th>Checked</th><th>Correct</th><th>Date wrong</th><th>Wrong document / CSP</th><th>Accuracy</th></tr></thead>`;
      const T = {AGREEMENT: "CSP Agreement", POLICE_VERIFICATION: "PVR / Character certificate", IIBF_CERTIFICATE: "IIBF certificate"};
      return `
      <div class="grid k4">
        <div class="card kpi"><div class="label">Measured accuracy</div><div class="n">${pct(a.overall.accuracy)}</div>
          <div class="small muted">from ${a.overall.checked} checked documents</div></div>
        <div class="card kpi"><div class="label">Checks waiting</div><div class="n">${a.overall.pending}</div>
          <div class="small muted"><a href="#" data-go="review">Open the Review queue</a></div></div>
        <div class="card kpi"><div class="label">Accepted automatically</div><div class="n">${pct(a.recent_outcome["accepted automatically"]?.share)}</div>
          <div class="small muted">of ${a.recent_documents} documents in ${a.recent_days} days</div></div>
        <div class="card kpi"><div class="label">Spot-check rate</div><div class="n">${Math.round(a.spot_check_rate * 100)}%</div>
          <div class="small muted">of documents accepted automatically</div></div>
      </div>
      <p class="small muted" style="margin-top:10px">Accuracy is measured only from documents a person checked in the Review queue (spot checks and reference checks): Accept = read correctly, a changed date = date wrong, Reject = wrong document or CSP. The more checks, the more reliable the figure; aim for at least 100.</p>
      <div class="grid k3" style="margin-top:14px">
        <div class="card tablewrap"><h2>By document</h2><table>${head}<tbody>${Object.entries(a.by_type).map(([k, r]) => row(T[k] || k, r)).join("")}</tbody></table></div>
        <div class="card tablewrap"><h2>By how it was read</h2><table>${head}<tbody>${Object.entries(a.by_route).map(([k, r]) => row(k, r)).join("") || `<tr><td colspan="6" class="empty">No checks yet.</td></tr>`}</tbody></table></div>
        <div class="card"><h2>Last ${a.recent_days} days</h2><dl class="kv">
          ${Object.entries(a.recent_outcome).map(([k, v]) => `<dt>${esc(k)}</dt><dd class="num">${v.count} (${v.share}%)</dd>`).join("") || "<dt>No documents</dt><dd></dd>"}
          ${Object.entries(a.recent_reading).map(([k, v]) => `<dt>read from ${esc(k)}</dt><dd class="num">${v}</dd>`).join("")}</dl></div>
      </div>
      <div class="card tablewrap" style="margin-top:14px"><h2>Latest mistakes found</h2>${a.mistakes.length ? `<table><thead><tr><th>CSP</th><th>Document</th><th>Found</th><th>Read from</th><th></th></tr></thead><tbody>
        ${a.mistakes.map((m) => `<tr><td class="mono">${esc(m.csp)}</td><td>${esc(T[m.type] || m.type)}<div class="small muted">${esc(m.file || "")}</div></td>
          <td>${badge("EXPIRED", m.verdict)}</td><td class="small">${esc(m.how_read)}</td><td><a href="#" data-file="${m.document_id}">view</a></td></tr>`).join("")}</tbody></table>`
        : `<div class="empty">No mistakes found in the checks so far.</div>`}</div>`;
    },

    async analytics() {
      const a = await api("/api/hub/analytics?days=14");
      const pct = (n, d) => d ? Math.round(100 * n / d) + "%" : "—";
      const TYPES = {ONBOARD_ALL: "Onboarding (no documents)", UPLOAD_MISSING: "Documents missing", UPLOAD_EXPIRED: "Documents expired",
                     UNREADABLE_REUPLOAD: "Unreadable, re-upload", RENEWAL_NOTICE: "Renewal notice", RENEWAL_FOLLOWUP: "Renewal reminder",
                     RENEWAL_FINAL: "Renewal final", LINK_REQUEST: "Link the CSP asked for",
                     UPLOAD_RECEIPT: "Reply after upload", UPLOAD_SUCCESS_ALL: "All documents recorded"};
      const m = a.periods.last_30_days, w = a.periods.last_7_days, t = a.periods.today;
      const days = a.days.slice().reverse();
      const rate = (n, d) => d ? Math.round(100 * n / d) : null;
      const r30 = rate(m.any, m.csps_reached), acc30 = rate(m.accepted, m.csps_reached);
      const failed = (p) => p.whatsapp.failed + p.email.failed;
      const funnel = [["Messaged", m.csps_reached], ["Opened the link", m.opened], ["Submitted the form", m.submitted],
                      ["Documents accepted", m.accepted], ["Asked the RM a question", m.asked], ["Replied by email", m.email_reply]];
      return `<div class="mx">
      ${band(failed(w) ? "warn" : "ok", m.csps_reached ? `${r30}% of messaged CSPs responded in the last 30 days` : "No messages in the last 30 days",
        `Responded = within ${a.response_days} days of a message the CSP opened their link, submitted the form, asked a question or replied by email (India time; the test CSP is never counted).`,
        [chip(failed(w) ? "warn" : "ok", `${failed(w)} failed this week`), chip("ok", `${m.accepted} CSPs sent accepted documents`)])}
      ${strip(
        metric("WhatsApp today", t.whatsapp.sent, "", `${t.whatsapp.delivered} delivered · ${t.whatsapp.read} read`, spark(days.map((d) => d.whatsapp.sent))),
        metric("CSPs reached · 7 days", w.csps_reached, "", `${w.whatsapp.sent} WhatsApp · ${w.email.sent} email`),
        metric("Responded · 30 days", r30 ?? "—", r30 != null ? "%" : "", `${m.any} of ${m.csps_reached} CSPs`, fill(m.any, m.csps_reached, "ok")),
        metric("Documents accepted · 30 days", acc30 ?? "—", acc30 != null ? "%" : "", `${m.accepted} CSPs after a message`, fill(m.accepted, m.csps_reached, "ok")))}
      <div class="mx-cols">
        ${panel("Last 30 days: from message to documents", "Share of the CSPs messaged", bars(funnel.map(([l, n], i) => [`${l}${i ? ` · ${pct(n, m.csps_reached)}` : ""}`, n, i === 3 ? "ok" : ""])))}
        <div class="mx-stack">
          ${panel("Who sent them", "", bars(a.senders.map((x) => [x.who, x.whatsapp + x.email]), "Nothing sent yet."))}
          ${panel("What was sent", "", bars(a.types.map((x) => [TYPES[x.type] || x.type, x.whatsapp + x.email]), "Nothing sent yet."))}
        </div>
      </div>
      ${panel("Day by day", "", `<div class="tablewrap"><table class="mx-table"><thead><tr><th>Day</th><th class="r">WhatsApp</th><th class="r">Delivered / read</th><th class="r">Email</th><th class="r">Failed</th><th class="r">Blocked</th>
          <th class="r">Reached</th><th class="r">Opened link</th><th class="r">Submitted</th><th class="r">Accepted</th><th class="r">Asked</th><th class="r">Email reply</th></tr></thead><tbody>
        ${a.days.map((d) => { const r = d.responses; return `<tr><td class="mx-when">${fmt(d.date)}${d.date === a.today ? " · today" : ""}</td>
          <td class="r">${d.whatsapp.sent}</td><td class="r">${d.whatsapp.delivered} / ${d.whatsapp.read}</td><td class="r">${d.email.sent}</td>
          <td class="r">${failed(d) ? chip("warn", failed(d)) : 0}</td><td class="r">${d.whatsapp.blocked + d.email.blocked}</td>
          <td class="r">${r.reached}</td><td class="r">${r.opened}</td><td class="r">${r.submitted}</td><td class="r">${r.accepted}</td>
          <td class="r">${r.asked}</td><td class="r">${r.email_reply}</td></tr>`; }).join("")}
        </tbody></table></div>`)}
      </div>`;
    },

    async find() {
      const f = state.find;
      const d = await api(`/api/hub/find?${findQuery(f)}&page=${state.page}&size=50`);
      const sel = (key, label, opts) => `<label class="small">${label}<br><select data-fkey="${key}">${opts.map(([v, l]) =>
        `<option value="${v}" ${String(f[key] ?? "") === String(v) ? "selected" : ""}>${l}</option>`).join("")}</select></label>`;
      const rms = [["", "any"], ...(state.rms || []).map((n) => [n, n])];
      const pages = Math.max(1, Math.ceil(d.total / d.size));
      return `<p class="small muted">Pick a state for each document; "any" means it doesn't matter. Example: <i>only the agreement expired</i> = Agreement expired, PVR valid, IIBF valid. Expiring = valid but ends within 60 days.</p>

      <div class="toolbar" style="flex-wrap:wrap;gap:12px">
        ${sel("agr", "Agreement", FSTATES)} ${sel("pvr", "PVR / Character", FSTATES)} ${sel("iibf", "IIBF", FSTATES.filter(([v]) => !["EXPIRING", "EXPIRED"].includes(v)))}
        ${sel("slab", "Label", [["", "any"], [1, "1"], [2, "2"], [3, "3"], [4, "4"]])}
        ${state.summary.me.role === "ADMIN" ? sel("rm", "RM", rms) : ""}
        ${sel("form", "Upload page", [["", "any"], ["yes", "used it"], ["no", "not used"], ["accepted", "all accepted"], ["partly", "partly accepted"], ["rejected", "tried, nothing accepted"]])}
        <span class="muted"><b>${d.total}</b> CSPs</span>
        <a class="btn" href="#" data-findxlsx="1">Download this list (.xlsx)</a></div>
      <div class="card tablewrap">${d.rows.length ? `<table><thead><tr><th>CSP</th><th>Agreement</th><th>PVR</th><th>IIBF</th><th>RM / DC</th><th>Upload page</th></tr></thead><tbody>
        ${d.rows.map((r) => `<tr class="click" data-csp="${r.id}">
          <td><div class="mono">${esc(r.code)}</div><div>${esc(r.name)}</div><div class="small">${badge("c" + r.category, r.sub_slab_label)}</div></td>
          <td>${docCell(r.docs.AGREEMENT)}</td><td>${docCell(r.docs.POLICE_VERIFICATION)}</td><td>${docCell(r.docs.IIBF_CERTIFICATE)}</td>
          <td class="small">${esc(r.rm || "—")}<br><span class="muted">${esc(r.dc || "no DC")}</span></td>
          <td class="small">${esc(r.form ? {accepted: "all accepted", partly: "partly", rejected: "nothing accepted"}[r.form] : "—")}</td></tr>`).join("")}
        </tbody></table>` : `<div class="empty">No CSPs match.</div>`}</div>
      ${pager(pages)}`;
    },

    async formuploads() {
      const out = state.fout ?? "", days = state.fdays ?? 0;
      // All submissions (newest first), grouped one row per CSP; the outcome
      // tabs filter CSPs by their latest submission.
      const d = await api(`/api/hub/form-uploads?days=${days}`);
      const k = d.counts;
      // DC master link (admins): one link for every working CSP; the URL is shown once, when made.
      let ml = "";
      if (state.summary.me.role === "ADMIN") {
        const m = await api("/api/hub/master-link");
        ml = `<div class="card" style="margin-bottom:12px"><div class="meta"><b>DC master link</b>
          ${m.active ? badge("VALID", "active") + ` <span class="small muted">made by ${esc(m.created_by || "")} ${when(m.created_at)} · works till ${when(m.expires_at)}</span>` : badge("EXPIRED", "none active")}</div>
          <p class="small muted">One link for all DCs: they pick a KO code and upload for any CSP in Labels 1–4. Documents valid for more than 60 days are locked. Their uploads appear in the Review queue as "DC upload".</p>
          ${state.mlUrl ? `<div class="toolbar"><input type="text" readonly value="${esc(state.mlUrl)}" style="flex:1" class="mono" onclick="this.select()"><span class="small muted">Copy it now: it is shown only once.</span></div>` : ""}
          <div class="toolbar"><button class="btn primary" data-mlink="new">${m.active ? "Make a new link (the old one stops)" : "Make the link"}</button>
          ${m.active ? `<button class="btn" data-mlink="revoke">Switch it off</button>` : ""}</div>
          <div class="meta" style="margin-top:14px"><b>Excel for one DC</b></div>
          <p class="small muted">That DC's CSPs in plain words: what is on file and what to upload, needs first, coloured green / yellow / red. Download it and share it with the DC yourself.</p>
          <div class="toolbar"><select id="dcxl">${m.dcs.map((u) => `<option value="${u.id}">${esc(u.name)} (${u.csps} CSPs)</option>`).join("")}</select>
          <button class="btn" data-dcxlsx="1" ${m.dcs.length ? "" : "disabled"}>Download DC Excel</button></div></div>`;
      }
      const OUT = {accepted: ["VALID", "all accepted"], checking: ["REVIEW", "being checked"], partly: ["REVIEW", "partly accepted"], rejected: ["EXPIRED", "nothing accepted"]};
      const slabTxt = (n, sub) => n ? `Label ${sub || n}` : "—";
      const groups = [];
      const byCsp = {};
      for (const r of d.rows) {
        if (!byCsp[r.csp.id]) { byCsp[r.csp.id] = {csp: r.csp, rm: r.rm, attempts: []}; groups.push(byCsp[r.csp.id]); }
        byCsp[r.csp.id].attempts.push(r);
      }
      const shown = groups.filter((g) => !out || g.attempts[0].outcome === out);
      const open = state.fopen || (state.fopen = new Set());
      const results = (r) => `<div class="kv" style="margin-top:6px">${r.results.map((x) => `
          <dt>${esc(DOC[x.type] || x.section)}</dt>
          <dd>${x.in_review ? "🔍" : x.ok ? "✅" : "❌"} ${esc(x.now ? x.now : x.reason)}${x.now ? ` <span class="muted">(at upload: ${esc(x.reason)})</span>` : ""}${x.read_as && !x.ok ? ` <span class="muted">(read as ${esc(DOC[x.read_as] || x.read_as)})</span>` : ""}
            ${x.document_id ? ` · <a href="#" data-file="${x.document_id}">view</a>` : ""}${x.kept_file ? ` · <a href="#" data-keptfile="${r.id}/${x.i}">view what they sent</a>` : ""}
            ${x.filename ? `<span class="small muted"> · ${esc(x.filename)}</span>` : ""}</dd>`).join("")}</div>`;
      const attempt = (r, n) => `<div style="border-top:1px solid var(--border);padding-top:8px;margin-top:8px">
          <div class="meta small">${badge(OUT[r.outcome][0], OUT[r.outcome][1])} <b>Attempt ${n}</b>
            ${r.slab_before && r.slab_after && r.slab_before !== r.slab_after ? ` <span class="muted">· label ${r.slab_before} → ${r.slab_after}</span>` : ""}
            <span class="muted" style="margin-left:auto">${when(r.at)}</span></div>
          ${results(r)}
          ${r.contact_changes ? `<div class="small" style="margin-top:6px">Also changed ${r.contact_changes} contact detail(s): see <a href="#" data-go="contacts">Contacts</a>.</div>` : ""}</div>`;
      return `${ml}<p class="small muted">One row per CSP who used the upload page: their latest result and their label now. Click <b>Show all attempts</b> to see every try — what they sent, what was accepted or turned away and why. <b>"Tried, nothing accepted"</b> are the CSPs to call first.</p>

    async review() {
      const d = await api("/api/hub/review");

      return `<p class="small muted">Conflicts the agent can't decide (a different CSP's name on the document, a typed date that differs from the one read…), plus <b>spot checks</b> (5% of documents the agent accepted on its own) and <b>reference checks</b>. Open the document, then <b>Accept</b> if the type, the CSP and the issue date are right, correct the date if it's wrong, or <b>Reject</b> if it's the wrong document or CSP. Your answers measure the agent's accuracy (see Accuracy).</p>

          <label>Validity stated <select id="rm${r.id}"><option value="">as read</option>
            <optgroup label="Agreement"><option value="12">1 year</option><option value="24">2 years</option><option value="36">3 years</option><option value="60">5 years</option></optgroup>
            <optgroup label="Police certificate"><option value="6">6 months</option><option value="12">1 year</option><option value="-1">No expiry (Police Clearance Certificate)</option></optgroup></select></label>
          <button class="btn" data-reread="${r.id}" title="Read the document again with the agent's latest rules (doesn't accept it)">Re-read with current rules</button>
          <button class="btn primary" data-resolve="${r.id}" data-accept="1">Accept</button>
          <button class="btn danger" data-resolve="${r.id}" data-accept="0">Reject document</button></div></div>`).join("") || `<div class="card empty">Nothing to review.</div>`}`;

  // What the local AI model read (a suggestion only; the reviewer decides).
  function aiHint(s) {
    if (!s) return "";
    if (!s.provider || s.legible === false) return `<p class="small muted">AI helper could not read this document either.</p>`;
    const v = s.validity_months ? (s.validity_months % 12 ? `${s.validity_months} months` : `${s.validity_months / 12} year(s)`) : "not stated";
    return `<p class="small" style="background:var(--saffron-soft,#fdf3d7);padding:6px 10px;border-radius:8px">🤖 <b>AI helper read</b> (check it on the document):
      type ${esc(DOC[s.document_type] || s.document_type || "-")} · issued <span class="mono">${esc(s.issue_date || "not read")}</span> · validity ${esc(v)}
      ${s.evidence ? `<br><span class="muted">“${esc(s.evidence)}”</span>` : ""}</p>`;
  }

  function pager(pages) {
    if (pages <= 1) return "";
    return `<div class="toolbar" style="margin-top:10px"><button class="btn" data-page="${state.page - 1}" ${state.page <= 1 ? "disabled" : ""}>‹ Prev</button>
      <span class="small muted">Page ${state.page} of ${pages}</span><button class="btn" data-page="${state.page + 1}" ${state.page >= pages ? "disabled" : ""}>Next ›</button></div>`;
  }

      <div class="meta">${badge(m.status)} <b class="mono">${esc(m.csp_code || "")}</b> ${esc(m.csp_name || "")}
        <span class="small muted">→ ${esc(m.role)} · ${esc(m.to)} · ${esc(m.template)} · ${esc(m.stage || "")}${m.edited ? " · edited" : ""}</span>
        <span class="small muted" style="margin-left:auto">${when(m.created_at)}</span></div>
      ${m.channel === "EMAIL" ? `<div style="margin-top:6px"><b>${esc(m.subject)}</b></div>` : ""}
      <pre>${esc(m.body)}</pre>
      ${m.error ? `<div class="small" style="color:var(--danger-ink);margin-top:6px">${esc(m.error)}</div>` : ""}
      ${m.sent_at ? `<div class="small muted">Sent ${when(m.sent_at)}${m.delivery_status ? " · " + esc(m.delivery_status) : ""}</div>` : ""}
      ${m.reviewed_by ? `<div class="small muted">Reviewed by ${esc(m.reviewed_by)} · ${when(m.reviewed_at)}</div>` : ""}
      ${draft ? `<div class="actions"><button class="btn primary" data-approve="${m.id}">Approve${m.channel === "WHATSAPP" && !["wabs", "push"].includes(window.WA_MODE) ? "" : " & send"}</button>
        <button class="btn" data-edit="${m.id}">Edit text</button><button class="btn danger" data-reject="${m.id}">Reject</button></div>` : ""}
      ${m.status === "READY_NOT_SENT" && m.channel === "WHATSAPP" && ["wabs", "push"].includes(window.WA_MODE)
        ? `<div class="actions"><button class="btn primary" data-sendnow="${m.id}">Send now</button>
           <button class="btn danger" data-reject="${m.id}">Reject</button></div>` : ""}
    </div>`;
  }

      <div class="card" style="margin-top:14px"><h2>All files received (${d.documents.length})</h2><div class="tablewrap"><table><thead><tr><th>Type</th><th>Status</th><th>Issued</th><th>Expires</th><th>How</th><th>Received</th><th></th></tr></thead><tbody>
        ${d.documents.map((x) => `<tr><td>${esc(DOC[x.type] || x.type)}${x.is_current ? " <span class='b VALID'>current</span>" : ""}</td>

          <td class="small">${esc((x.date_source || x.reason || "").replaceAll("_", " ").toLowerCase())}</td><td class="small">${esc(x.channel === "CSP_UPLOAD_PORTAL" ? "portal" : "gmail")} ${fmt(x.source_date || x.uploaded_at)}</td>
          <td><a href="#" data-file="${x.id}">view</a></td></tr>`).join("") || `<tr><td colspan="7" class="empty">None.</td></tr>`}</tbody></table></div></div>

  function closeDrawer() { $("#drawer").classList.remove("open"); $("#backdrop").classList.remove("open"); }

  function openFile(id, download) { return openPath(`api/hub/documents/${id}/file${download ? "?download=1" : ""}`); }
  async function openPath(path) {
    // Open the tab now, while the click still counts: a tab opened after the
    // download finishes is blocked as a pop-up.
    const tab = window.open("", "_blank");
    if (tab) tab.document.write("<p style='font-family:sans-serif'>Loading document…</p>");
    const r = await fetch(path, {credentials: "same-origin", headers: H});
    if (!r.ok) { if (tab) tab.close(); return toast(r.status === 401 ? "Wrong API key." : "File not found."); }
    const url = URL.createObjectURL(await r.blob());
    if (tab) tab.location.href = url;
    else toast("Allow pop-ups for this site to view documents.");
    setTimeout(() => URL.revokeObjectURL(url), 60000);
  }

  // ----------------------------------------------------------- events
  document.addEventListener("click", async (e) => {
    const t = e.target.closest("[data-view],[data-go],[data-cat],[data-csp],[data-page],[data-channel],[data-mstatus],[data-mslab],[data-mkind],[data-sub],[data-tag],[data-doctype],[data-approve],[data-sendnow],[data-answer],[data-findset],[data-findxlsx],[data-qstatus],[data-fout],[data-fdays],[data-fcsp],[data-keptfile],[data-reject],[data-edit],[data-run],[data-file],[data-zip],[data-xlsx],[data-link],[data-savestaff],[data-cc],[data-resolve],[data-reread],[data-mtab],[data-wanum],[data-mlink],[data-dcxlsx],#closedrawer,#approveall,#refresh");
    if (!t) return;
    const ds = t.dataset;
    try {
      if (t.id === "closedrawer") return closeDrawer();
      if (t.id === "refresh") return render();
      if (ds.view || ds.go) { e.preventDefault(); state.view = ds.view || ds.go; state.page = 1; return render(); }
      if (ds.cat) { state.view = "categories"; state.cat = +ds.cat; state.expiredOnly = false; state.sub = ""; state.tag = ""; state.page = 1; return render(); }
      if (ds.sub !== undefined) { state.sub = ds.sub; state.page = 1; return render(); }
      if (ds.tag !== undefined) { state.tag = ds.tag; state.page = 1; return render(); }
      if (ds.page) { state.page = +ds.page; return render(); }
      if (ds.channel) { state.channel = ds.channel; return render(); }
      if (ds.mstatus) { state.msgStatus = ds.mstatus; return render(); }
      if (ds.mslab !== undefined) { state.msgSlab = ds.mslab; return render(); }
      if (ds.mkind !== undefined) { state.msgKind = ds.mkind; return render(); }
      if (ds.doctype !== undefined) { state.docType = ds.doctype; return render(); }
      if (ds.file) { e.preventDefault(); return openFile(ds.file); }
      if (ds.xlsx) {
        e.preventDefault();
        const r = await fetch(`api/hub/reports/${ds.xlsx}.xlsx`, {credentials: "same-origin", headers: H});
        if (!r.ok) return alert("Report failed: " + r.status);
        const a = document.createElement("a"); a.href = URL.createObjectURL(await r.blob());
        a.download = (r.headers.get("Content-Disposition") || "").split('"')[1] || "report.xlsx"; a.click(); return;
      }
      if (ds.zip) {
        e.preventDefault();
        const r = await fetch(`api/hub/csp/${ds.zip}/zip`, {credentials: "same-origin", headers: H});
        const a = document.createElement("a"); a.href = URL.createObjectURL(await r.blob());
        a.download = (r.headers.get("Content-Disposition") || "").split('"')[1] || "documents.zip"; a.click(); return;
      }
      if (ds.csp) return openCsp(ds.csp);
      if (ds.dcxlsx) {
        const r = await fetch(`api/hub/dc-report.xlsx?dc_id=${$("#dcxl").value}`, {credentials: "same-origin", headers: H});
        if (!r.ok) return alert("Download failed: " + r.status);
        const a = document.createElement("a"); a.href = URL.createObjectURL(await r.blob());
        a.download = (r.headers.get("Content-Disposition") || "").split('"')[1] || "dc.xlsx"; a.click(); return;
      }
      if (ds.mlink === "new") { if (!confirm("Make a new DC master link? Any older master link stops working.")) return; state.mlUrl = (await post("/api/hub/master-link")).url; return render(); }
      if (ds.mlink === "revoke") { if (!confirm("Switch off the DC master link? DCs can no longer use it.")) return; await post("/api/hub/master-link/revoke"); state.mlUrl = ""; return render(); }
      if (ds.approve) { const m = await post(`/api/hub/messages/${ds.approve}/approve`); toast(`Approved → ${m.status.replaceAll("_", " ").toLowerCase()}`); return refreshAfterAction(); }
      if (ds.sendnow) { if (!confirm("Send this WhatsApp message to the CSP now?")) return; const m = await post(`/api/hub/messages/${ds.sendnow}/send-now`); toast(`→ ${m.status.replaceAll("_", " ").toLowerCase()}${m.error ? ": " + m.error : ""}`); return refreshAfterAction(); }
      if (ds.findset) { e.preventDefault(); state.find = JSON.parse(ds.findset); state.page = 1; state.view = "find"; return render(); }
      if (ds.findxlsx) {
        e.preventDefault();
        const r = await fetch(`api/hub/find.xlsx?${findQuery(state.find)}`, {credentials: "same-origin", headers: H});
        if (!r.ok) return alert("Download failed: " + r.status);
        const a = document.createElement("a"); a.href = URL.createObjectURL(await r.blob());
        a.download = (r.headers.get("Content-Disposition") || "").split('"')[1] || "csps.xlsx"; a.click(); return;
      }
      if (ds.fcsp) { const id = +ds.fcsp, o = state.fopen || (state.fopen = new Set()); o.has(id) ? o.delete(id) : o.add(id); return render(); }
      if (ds.fout !== undefined) { state.fout = ds.fout; return render(); }
      if (ds.mtab) { state.mtab = ds.mtab; return render(); }
      if (ds.reread) {
        t.disabled = true; t.textContent = "Reading…";
        try { const r = await post(`/api/hub/review/${ds.reread}/reread`); toast(r.changed ? "Re-read: dates updated, check and accept." : "Re-read: same result as before."); }
        catch (err) { toast(err.message); }
        return render();
      }
      if (ds.fdays !== undefined) { state.fdays = +ds.fdays; return render(); }
      if (ds.keptfile) { e.preventDefault(); const [ev, i] = ds.keptfile.split("/"); return openPath(`api/hub/form-uploads/${ev}/file/${i}`); }
      if (ds.answer) { await post(`/api/hub/questions/${ds.answer}/answer`, {note: $(`#qn${ds.answer}`)?.value || ""}); toast("Marked answered."); return render(); }
      if (ds.qstatus !== undefined) { state.qstatus = ds.qstatus; return render(); }
      if (ds.reject) { const why = prompt("Reason for rejecting (optional)") ?? null; if (why === null) return; await post(`/api/hub/messages/${ds.reject}/reject`, {reason: why}); toast("Rejected."); return refreshAfterAction(); }
      if (ds.edit) {
        const card = t.closest("[data-msg]"); const pre = $("pre", card);
        const ta = document.createElement("textarea"); ta.value = pre.textContent; pre.replaceWith(ta);
        t.textContent = "Save text"; t.dataset.edit = ""; t.onclick = async () => { await post(`/api/hub/messages/${ds.edit}/edit`, {body: ta.value}); toast("Saved."); refreshAfterAction(); };
        return;
      }
      if (t.id === "approveall") {
        const ids = [...document.querySelectorAll("[data-approve]")].map((b) => +b.dataset.approve);
        if (!confirm(`Approve ${ids.length} drafts?`)) return;
        const r = await post("/api/hub/messages/approve-bulk", {ids}); toast("Done: " + JSON.stringify(r.result)); return render();
      }
      if (ds.run) { await post(`/api/hub/run/${ds.run}`); toast(`Started: ${ds.run}. Refresh in a moment.`); return; }
      if (ds.wanum) {
        try {
          const r = await post(`/api/hub/csp/${ds.wanum}/whatsapp-number`, {phone: $(`#wa${ds.wanum}`).value});
          toast(r.preferred_phone ? `WhatsApp now goes to ${r.preferred_phone}. ${r.waiting.length} message(s) waiting for approval.` : "Back to the calling sheet's numbers.");
          return openCsp(+ds.wanum);
        } catch (err) { toast(err.message); return; }
      }
      if (ds.link) { const r = await post(`/api/hub/csp/${ds.link}/upload-link`); prompt("Upload link (valid 7 days; replaces older links):", r.link); return; }
      if (ds.savestaff) {
        const id = ds.savestaff;
        await post(`/api/hub/staff/${id}`, {phone: $(`[data-staff-phone="${id}"]`).value, email: $(`[data-staff-email="${id}"]`).value});
        toast("Saved."); return render();
      }
      if (ds.cc) { await post(`/api/hub/contact-changes/${ds.cc}`); return render(); }
      if (ds.resolve) {
        await post(`/api/hub/review/${ds.resolve}/resolve`, {accept: ds.accept === "1", issue_date: $(`#rv${ds.resolve}`)?.value || null,
          document_type: $(`#rt${ds.resolve}`)?.value || null, validity_months: Number($(`#rm${ds.resolve}`)?.value) || null,
          expiry_date: $(`#re${ds.resolve}`)?.value || null});
        toast("Resolved."); return render();
      }
    } catch (err) { toast(err.message); }
  });
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") closeDrawer();
    if (e.key === "Enter" && e.target.id === "q") { state.q = e.target.value; state.page = 1; render(); }
  });
  document.addEventListener("change", (e) => {
    if (e.target.id === "expiredonly") { state.expiredOnly = e.target.checked; state.page = 1; render(); }
    if (e.target.dataset.fkey) {
      const f = {...state.find, [e.target.dataset.fkey]: e.target.value};
      if (!e.target.value) delete f[e.target.dataset.fkey];
      state.find = f; state.page = 1; render();
    }
  });
  async function refreshAfterAction() { if ($("#drawer").classList.contains("open")) closeDrawer(); render(); }

  // ------------------------------------------------------------ render
  const TITLES = {overview: "Overview", categories: "Labels", documents: "Latest documents", comms: "Communication Hub",
                  contacts: "Contacts & gaps", ingestion: "Gmail ingestion", review: "Review queue", accuracy: "Accuracy",
                  questions: "CSP questions", formuploads: "Form uploads", find: "Find CSPs",
                  analytics: "Messaging analytics", monitoring: "Monitoring"};
  async function render() {
    try {
      state.summary = await api("/api/hub/summary");
      const s = state.summary;
      const drafts = s.drafts_pending.EMAIL + s.drafts_pending.WHATSAPP;
      $("#n-drafts").textContent = drafts || ""; $("#n-review").textContent = s.review_pending || "";
      $("#n-questions").textContent = s.questions_open || "";
      $("#nav-analytics").style.display = s.features?.analytics ? "" : "none";     // parked feature
      $("#n-form").textContent = s.form_uploads?.rejected || "";
      $("#n-cat").textContent = (s.categories[2] + s.categories[3] + s.categories[4]) || "";
      $("#modepill").textContent = s.modes.outbound === "review" ? "Review mode: nothing is sent without approval" : "Auto mode: approved messages send automatically";
      const me = s.me || {};
      $("#whoami").innerHTML = `${esc(me.name || "")} · <b>${esc(me.role || "")}</b><br><a href="#" id="logout">Sign out</a>`;
      $("#logout").onclick = (e) => { e.preventDefault(); logout(); };
      document.querySelectorAll('#nav [data-view="contacts"],#nav [data-view="ingestion"],#nav [data-view="accuracy"],#nav [data-view="monitoring"]')
        .forEach((b) => b.style.display = me.role === "ADMIN" ? "" : "none");
      window.WA_MODE = s.modes.whatsapp;
      $("#modes").innerHTML = `Outbound: <b>${esc(s.modes.outbound)}</b><br>WhatsApp: <b>${esc(s.modes.whatsapp)}</b><br>Sheet: ${esc(s.modes.calling_sheet)}`;
      document.querySelectorAll("#nav [data-view]").forEach((b) => b.classList.toggle("active", b.dataset.view === state.view));
      $("#title").textContent = TITLES[state.view];
      $("#view").innerHTML = await views[state.view]();
    } catch (err) { if (err.message !== "Unauthorised") $("#view").innerHTML = `<div class="card empty">Couldn't load: ${esc(err.message)}</div>`; }
  }
  async function boot() { $("#login").style.display = "none"; $("#app").style.display = "grid"; await render(); }
  boot();
})();
</script>
</body>
</html>
